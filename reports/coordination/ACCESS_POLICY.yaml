# ACCESS_POLICY.yaml — Command Center scoped automation rights
# Validated by scripts/validate_access_policy.py and CI job ci_apply_access_policy.
# Does NOT authorize LIVE trading, laptop token mint for Dhan, or secret value export.

apiVersion: system3.access/v1
kind: AccessPolicy
metadata:
  name: command-center-coordination
  policy_id: ACC-POL-CC-20260825
  version: "1.0.0"
  created_utc: "2026-08-25T13:00:00Z"
  signed_by: "agent-id:cursor-composer"
  signature_method: "local-metadata-hmac-placeholder"
  signature_status: "UNSIGNED_PENDING_VAULT"
  signature_note: "CI must verify signature when vault signer available; until then mint is denied and access-request required."
  notify_channel: "issue:#188"
  approver_email: "warghade2012@gmail.com"
  repo: "psw2025-cmd/Genesis_System3"
  scope_paths:
    - "reports/coordination/"
    - "scripts/run_command_center_refresh.ps1"
    - "scripts/system3_command_center_refresh.py"
    - "scripts/system3_pending_tracker_refresh.py"
    - "scripts/system3_build_operating_options_xlsx.py"
    - "scripts/validate_access_policy.py"
    - "scripts/command_center_smoke_test.py"
    - "scripts/ci_apply_access_policy.yml"
    - ".github/workflows/command-center-access.yml"

spec:
  mode: "coordination_automation"
  live_trading_allowed: false
  laptop_broker_mint_allowed: false
  secret_value_export_allowed: false

  credentials:
    mint_allowed: false
    reason_mint_denied: "signature_status UNSIGNED_PENDING_VAULT — no vault signer bound for this policy yet"
    ephemeral_store: "ci_ephemeral_env"
    requested_ttl: "1h"
    vault_role: "system3-command-center-readonly"
    vault_keys_required:
      - "SYSTEM3_CC_SIGNER_KEY"
      - "SYSTEM3_CC_SMOKE_TOKEN"
    access_request_on_deny: true

  permissions:
    - id: read_live_http
      allow: true
      resources: ["https://genesis-system3-web-doq2wplepa-el.a.run.app/api/*"]
    - id: write_coordination_overwrite
      allow: true
      resources:
        - "reports/coordination/COMMAND_CENTER.md"
        - "reports/coordination/ISSUES_ONLY.md"
        - "reports/coordination/ISSUES_MERMAID.md"
        - "reports/coordination/TRACKING_CHECKLIST.md"
        - "reports/coordination/TRACKING_CHECKLIST.json"
        - "reports/coordination/session_issues_master.csv"
        - "reports/coordination/AGENT_OPERATING_OPTIONS.xlsx"
        - "reports/coordination/ACCESS_POLICY.yaml"
        - "reports/coordination/AUDIT_LOG.jsonl"
    - id: run_command_center_refresh
      allow: true
      resources: ["scripts/run_command_center_refresh.ps1"]
    - id: mint_ephemeral_ci_token
      allow: false
      resources: ["vault:system3-command-center-readonly"]

  smoke_tests:
    required_before_apply: true
    script: "scripts/command_center_smoke_test.py"
    checks:
      - access_policy_schema
      - excel_sheets_1_to_8
      - command_center_artifacts_exist
      - live_deploy_info_http
      - no_live_trading_flag

  audit:
    append_only_path: "reports/coordination/AUDIT_LOG.jsonl"
    required_fields:
      - utc
      - agent_id
      - run_id
      - action
      - signer
      - token_id
      - ttl
      - result

  acceptance:
    issues_only_p0_ack_max_age_hours: 1
    command_center_must_include:
      - last_run_id
      - token_metadata
      - policy_id
      - signature_status
