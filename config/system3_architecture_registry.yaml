version: "1.0"
created_by: ChatGPT
last_edited_by: ChatGPT
purpose: "Machine-readable architecture registry backing the human blueprint, BAT audit, agent work queue, and visual graph."
authorities:
  code: "GitHub main"
  blueprint: "Google Drive SYSTEM3_ARCHITECTURE_BLUEPRINT_SSOT"
  runtime: "local laptop"
  evidence: "Google Drive sanitized evidence"
safety:
  mode: "PAPER/ANALYZER"
  live_trading: false
  real_broker_order_count: 0
  gcp_runtime_allowed: false
retention_classes:
  PERMANENT: "core code/config/schema/migration/controller SSOT/current model metadata"
  LATEST_REPLACE: "current status; overwrite same canonical file"
  DAILY_7D: "one DAY_YYYY-MM-DD folder; same-day reruns replace; keep latest 7 days"
  TEMP_DELETE: "scratch/test artifacts deleted after proof summarized"
  MILESTONE_KEEP: "accepted milestone proof only"
phase_gate_rule: "A downstream phase cannot PASS while a required upstream phase is not proven."
blueprint_first_rule: "If a discovered component/field/path/dependency is absent from the blueprint, add a NEW/AUDIT_REQUIRED entry before implementation."
lineage_contract:
  - source
  - source_field
  - local_path
  - producer
  - store_type
  - db_or_dataset
  - table
  - column_or_header
  - data_type
  - unit
  - primary_key
  - foreign_or_join_key
  - timestamp_field
  - freshness_threshold
  - formula_or_transform
  - feature
  - model
  - scanner
  - strategy
  - ranker
  - signal
  - risk_gate
  - paper_trade_stage
  - api_endpoint
  - json_field
  - ui_tab
  - ui_widget
  - evidence_path
  - backup_rule
  - retention_class
  - failure_state
  - recovery_rule
