required_foundation_blocks:
  historical_data:
    status: AUDIT_REQUIRED
    requirement: "Prove intended multi-year history store, exact symbol universe, fields, dates, automation, backfill, dedupe, adjustment rules, training/backtest consumers."
  paper_store:
    status: AUDIT_REQUIRED
    requirement: "One canonical PAPER trade/fill/exit/P&L store with DB=API=UI reconciliation and no fixture/synthetic current truth."
  holdings:
    status: AUDIT_REQUIRED
    requirement: "Read-only broker holdings source, local persistence/history if required, analytics, API/UI lineage."
  multibagger:
    status: AUDIT_REQUIRED
    requirement: "Source→storage→features→ranking/model→history→API→UI automation or explicit gap."
  news_catalyst:
    status: AUDIT_REQUIRED
    requirement: "Source→storage→normalization→symbol/event linking→feature/strategy consumers→API/UI or explicit gap."
agent_workflow:
  - "read blueprint + registry"
  - "discover current repo/runtime truth"
  - "record missing blueprint row first"
  - "reproduce"
  - "write failing regression"
  - "implement root fix"
  - "restart"
  - "verify DB/API/UI"
  - "rerun same-day BAT"
  - "update same blueprint row"
  - "publish sanitized evidence"
  - "continue highest upstream dependency gap"
