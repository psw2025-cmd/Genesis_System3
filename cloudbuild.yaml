steps:
  # Reject source-based mini-app uploads and missing production routes before build.
  - name: 'python:3.11-slim'
    entrypoint: 'python'
    args: ['scripts/cloud_run_source_integrity_gate.py', '--root', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'dashboard/backend/Dockerfile'
      - '-t'
      - 'asia-south1-docker.pkg.dev/system3-openalgo-safe/cloud-run-source-deploy/genesis-system3-web:latest'
      - '-t'
      - 'asia-south1-docker.pkg.dev/system3-openalgo-safe/cloud-run-source-deploy/genesis-system3-web:$COMMIT_SHA'
      - '.'
images:
  - 'asia-south1-docker.pkg.dev/system3-openalgo-safe/cloud-run-source-deploy/genesis-system3-web:latest'
  - 'asia-south1-docker.pkg.dev/system3-openalgo-safe/cloud-run-source-deploy/genesis-system3-web:$COMMIT_SHA'
options:
  logging: CLOUD_LOGGING_ONLY
