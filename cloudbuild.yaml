# Canonical immutable Cloud Run image build.
# Use: gcloud builds submit --config cloudbuild.yaml --substitutions=_GIT_SHA=<commit> .
# Do not use `gcloud run deploy --source .`: it selects the legacy root Dockerfile.
steps:
  - name: python:3.11-slim
    id: immutable-build-metadata-gate
    entrypoint: python
    args:
      - scripts/cloud_run_build_metadata_gate.py
      - ${_GIT_SHA}
      - ${_IMAGE}
  - name: python:3.11-slim
    id: source-integrity-gate
    entrypoint: python
    args: [scripts/cloud_run_source_integrity_gate.py, --root, .]
  - name: gcr.io/cloud-builders/docker
    id: build-canonical-image
    args:
      - build
      - --file=dashboard/backend/Dockerfile
      - --build-arg=DEPLOY_GIT_SHA=${_GIT_SHA}
      - --tag=${_IMAGE}:${_GIT_SHA}
      - .
  - name: gcr.io/cloud-builders/docker
    id: push-immutable-image
    args:
      - push
      - ${_IMAGE}:${_GIT_SHA}
images:
  - ${_IMAGE}:${_GIT_SHA}
options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _GIT_SHA: UNSET
  _IMAGE: asia-south1-docker.pkg.dev/system3-openalgo-safe/cloud-run-source-deploy/genesis-system3-web
