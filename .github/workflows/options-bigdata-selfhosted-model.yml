name: Options Big-Data Self-Hosted Model

on:
  pull_request:
    paths:
      - "src/options_research/eod_features.py"
      - "src/options_research/eod_model.py"
      - "src/options_research/manifest.py"
      - "scripts/options_bigdata_download.py"
      - "scripts/options_bigdata_eod_train_backtest.py"
      - "scripts/profile_options_archive.py"
      - ".github/workflows/options-bigdata-selfhosted-model.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: options-bigdata-selfhosted-model-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-train-frozen-holdout:
    runs-on: self-hosted
    timeout-minutes: 355
    env:
      LIVE_TRADING_ENABLED: "0"
      SYSTEM3_LIVE_TRADING_ALLOWED: "0"
      DATA_ROOT: 'C:\System3ResearchData\Genesis_System3\options'
      WORK_ROOT: 'C:\System3ResearchData\Genesis_System3\options_model_work'
      REPORT_ROOT: 'reports\latest\options_bigdata_selfhosted_model'
    steps:
      - uses: actions/checkout@v4

      - name: Prove installed interpreter and persistent archive
        shell: pwsh
        run: |
          python --version
          python -c "import sys; print(sys.executable)"
          if (-not (Test-Path $env:DATA_ROOT)) { throw "Persistent data root missing: $env:DATA_ROOT" }
          if (-not (Test-Path (Join-Path $env:DATA_ROOT "manifest.sqlite3"))) { throw "Manifest missing" }
          $files = @(Get-ChildItem (Join-Path $env:DATA_ROOT "nse_fo_eod") -Recurse -Filter *.parquet -File)
          Write-Host "persisted_parquet_files=$($files.Count)"
          if ($files.Count -lt 2400) { throw "Expected at least 2400 persisted NSE sessions" }

      - name: Install research dependencies
        shell: pwsh
        run: python -m pip install pandas requests pyarrow scipy scikit-learn joblib pytest --quiet

      - name: Compile and run focused research tests
        shell: pwsh
        run: |
          python -m py_compile `
            src/options_research/manifest.py `
            src/options_research/eod_features.py `
            src/options_research/eod_model.py `
            scripts/options_bigdata_download.py `
            scripts/options_bigdata_eod_train_backtest.py `
            scripts/profile_options_archive.py
          python -m pytest -q tests/test_options_bigdata_download.py tests/test_options_bigdata_eod.py

      - name: Verify all persisted archive files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:REPORT_ROOT | Out-Null
          python scripts/options_bigdata_download.py verify `
            --start 2016-07-26 --end 2026-07-24 --limit 0 `
            --data-root $env:DATA_ROOT --report-dir $env:REPORT_ROOT
          if ($LASTEXITCODE -ne 0) { throw "Full persisted archive verification failed" }
          Copy-Item (Join-Path $env:REPORT_ROOT "summary.json") (Join-Path $env:REPORT_ROOT "archive_verify_summary.json") -Force

      - name: Profile complete option archive
        shell: pwsh
        run: |
          python scripts/profile_options_archive.py `
            --data-root $env:DATA_ROOT `
            --output (Join-Path $env:REPORT_ROOT "archive_profile.json")

      - name: Generate all valid features, train, and run frozen holdout
        shell: pwsh
        run: |
          python scripts/options_bigdata_eod_train_backtest.py `
            --data-root $env:DATA_ROOT `
            --work-root $env:WORK_ROOT `
            --report-root $env:REPORT_ROOT `
            --base-cost-bps 80 `
            --top-k 3 `
            --embargo-days 1 `
            --epochs 2

      - name: Assert full archive and model evidence
        shell: python
        run: |
          import json
          from pathlib import Path
          report = Path(r"reports/latest/options_bigdata_selfhosted_model")
          verify = json.loads((report / "archive_verify_summary.json").read_text())
          profile = json.loads((report / "archive_profile.json").read_text())
          model = json.loads((report / "eod_model_backtest_proof.json").read_text())
          assert verify["status"] in {"PASS", "PASS_WITH_QUARANTINE"}, verify
          assert verify["nse_remaining_weekdays"] == 0, verify
          assert verify["nse_retryable_failed_objects"] == 0, verify
          assert verify["structural_failure_count"] == 0, verify
          assert verify["sha_mismatches"] == 0, verify
          assert verify["missing_files"] == 0, verify
          assert verify["unreadable_files"] == 0, verify
          assert verify["duplicate_rows"] == 0, verify
          assert verify["invalid_traded_option_ohlc_rows"] == 0, verify
          assert profile["files"] == verify["files_checked"], (profile, verify)
          assert profile["rows"] == verify["rows_checked"], (profile, verify)
          assert model["all_valid_train_rows_used"] is True, model
          assert model["split"]["test_days"] >= 400, model["split"]
          assert model["frozen_test"]["trades"] >= 1000, model["frozen_test"]
          assert model["live_trading_enabled"] is False, model
          assert model["order_placement_allowed"] is False, model
          assert model["promotion_allowed"] is False, model
          final = {
              "status": "PASS",
              "archive_verify": verify,
              "archive_profile": profile,
              "model_backtest": model,
              "live_trading_enabled": False,
              "real_orders_attempted": 0,
              "promotion_allowed": False,
          }
          (report / "selfhosted_full_model_proof.json").write_text(
              json.dumps(final, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: options-bigdata-selfhosted-model-${{ github.run_id }}
          path: reports/latest/options_bigdata_selfhosted_model/
          retention-days: 30
          if-no-files-found: error
