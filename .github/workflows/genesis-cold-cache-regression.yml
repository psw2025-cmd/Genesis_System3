name: Genesis Cold Cache Regression
on:
  pull_request:
    paths:
      - 'tests/test_genesis_cold_cache_acceptance.py'
      - 'scripts/frontend_local_runtime_smoke.py'
      - '.github/workflows/genesis-cold-cache-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cold-cache-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute actual Genesis cold-cache regression tests
        run: python -m unittest -v tests.test_genesis_cold_cache_acceptance
