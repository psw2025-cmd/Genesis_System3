name: Options Big-Data Research

on:
  push:
    branches:
      - feat/nonlive-equity-options-bigdata-pipeline
    paths:
      - "src/options_research/**"
      - "scripts/options_bigdata_*.py"
      - "scripts/options_research_train_backtest.py"
      - "tests/test_options_bigdata_*.py"
      - "tests/test_options_research_train_backtest.py"
      - "requirements-research.txt"
      - ".github/workflows/options-bigdata-research.yml"
  pull_request:
    paths:
      - "src/options_research/**"
      - "scripts/options_bigdata_*.py"
      - "scripts/options_research_train_backtest.py"
      - "tests/test_options_bigdata_*.py"
      - "tests/test_options_research_train_backtest.py"
      - "requirements-research.txt"
      - ".github/workflows/options-bigdata-research.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "plan, nse-batch, dhan-batch, verify, train, or full-batch"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - nse-batch
          - dhan-batch
          - verify
          - train
          - full-batch
      start:
        description: "Historical start date"
        required: true
        default: "2021-07-26"
      end:
        description: "Historical end date"
        required: true
        default: "2026-07-26"
      interval:
        description: "Dhan minute interval"
        required: true
        default: "1"
        type: choice
        options: ["1", "5", "15", "25", "60"]
      batch_limit:
        description: "Next unfinished objects; 0 means unbounded"
        required: true
        default: "500"
      exchanges:
        description: "Comma-separated option exchanges"
        required: true
        default: "NSE,BSE"

permissions:
  contents: read

jobs:
  focused-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install research dependencies
        run: python -m pip install -r requirements-research.txt
      - name: Compile research scripts
        run: >-
          python -m py_compile
          src/options_research/__init__.py
          src/options_research/contracts.py
          src/options_research/manifest.py
          src/options_research/sources.py
          scripts/options_bigdata_download.py
          scripts/options_bigdata_full_pipeline.py
          scripts/options_research_train_backtest.py
      - name: Run focused tests
        run: >-
          python -m pytest -q
          tests/test_options_bigdata_download.py
          tests/test_options_bigdata_full_pipeline.py
          tests/test_options_research_train_backtest.py
      - name: Build deterministic planning master
        shell: python
        run: |
          from pathlib import Path
          rows = ["EXCH_ID,SEGMENT,INSTRUMENT,UNDERLYING_SYMBOL,UNDERLYING_SECURITY_ID,SYMBOL_NAME"]
          indices = [("NIFTY",13),("BANKNIFTY",25),("FINNIFTY",27),("MIDCPNIFTY",442),("SENSEX",51),("BANKEX",52)]
          rows += [f"NSE,D,OPTIDX,{s},{i},{s}" for s, i in indices]
          rows += [f"NSE,D,OPTSTK,STOCK{i+1},{1000+i},STOCK{i+1}" for i in range(140)]
          Path("planning_master.csv").write_text("\n".join(rows) + "\n", encoding="utf-8")
      - name: Run deterministic planner
        run: >-
          python scripts/options_bigdata_download.py plan
          --security-master planning_master.csv
          --start 2021-07-26 --end 2026-07-26 --interval 1
          --data-root storage/research_options
          --report-dir reports/latest/options_bigdata_research
      - name: Assert exact plan count and safety
        shell: python
        run: |
          import json
          from pathlib import Path
          data = json.loads(Path("reports/latest/options_bigdata_research/summary.json").read_text())
          assert data["underlyings"] == 146, data
          assert data["stock_underlyings"] == 140, data
          assert data["index_underlyings"] == 6, data
          assert data["dhan_planned_requests"] == 409920, data
          assert data["live_trading_enabled"] is False, data
          assert data["order_placement_allowed"] is False, data
      - uses: actions/upload-artifact@v4
        with:
          name: options-bigdata-focused-proof
          path: reports/latest/options_bigdata_research/
          if-no-files-found: error

  self-hosted-research-batch:
    if: github.event_name == 'workflow_dispatch' && inputs.action != 'plan'
    runs-on: self-hosted
    timeout-minutes: 355
    env:
      LIVE_TRADING_ENABLED: "0"
      SYSTEM3_LIVE_TRADING_ALLOWED: "0"
      SYSTEM3_RESEARCH_DATA_ROOT: ${{ vars.SYSTEM3_RESEARCH_DATA_ROOT }}
      DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
      DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Require persistent external data root
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SYSTEM3_RESEARCH_DATA_ROOT)) {
            throw "Repository variable SYSTEM3_RESEARCH_DATA_ROOT is required and must point outside the Git checkout."
          }
      - name: Install research dependencies
        run: python -m pip install -r requirements-research.txt
      - name: Execute resumable research action
        shell: pwsh
        run: |
          $common = @(
            "--start", "${{ inputs.start }}",
            "--end", "${{ inputs.end }}",
            "--interval", "${{ inputs.interval }}",
            "--limit", "${{ inputs.batch_limit }}",
            "--exchanges", "${{ inputs.exchanges }}",
            "--data-root", $env:SYSTEM3_RESEARCH_DATA_ROOT,
            "--report-dir", "reports/latest/options_bigdata_research"
          )
          switch ("${{ inputs.action }}") {
            "nse-batch" { python scripts/options_bigdata_download.py download-nse @common }
            "dhan-batch" {
              if ([string]::IsNullOrWhiteSpace($env:DHAN_ACCESS_TOKEN)) { throw "DHAN_ACCESS_TOKEN secret is required." }
              python scripts/options_bigdata_download.py download-dhan @common
            }
            "verify" { python scripts/options_bigdata_download.py verify @common }
            "train" {
              python scripts/options_research_train_backtest.py `
                --data-root $env:SYSTEM3_RESEARCH_DATA_ROOT `
                --report-dir reports/latest/options_bigdata_research
            }
            "full-batch" {
              if ([string]::IsNullOrWhiteSpace($env:DHAN_ACCESS_TOKEN)) { throw "DHAN_ACCESS_TOKEN secret is required." }
              python scripts/options_bigdata_full_pipeline.py `
                --data-root $env:SYSTEM3_RESEARCH_DATA_ROOT `
                --report-dir reports/latest/options_bigdata_research `
                --dhan-start "${{ inputs.start }}" `
                --end "${{ inputs.end }}" `
                --interval "${{ inputs.interval }}" `
                --batch-limit "${{ inputs.batch_limit }}" `
                --exchanges "${{ inputs.exchanges }}"
            }
            default { throw "Unsupported action" }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: options-bigdata-research-proof-${{ github.run_id }}
          path: reports/latest/options_bigdata_research/
          if-no-files-found: warn
