name: Dashboard Live UI Proof

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'dashboard/frontend/src/App.tsx'
      - 'dashboard/frontend/src/hooks/useData.ts'
      - 'dashboard/frontend/src/store.ts'
      - 'dashboard/frontend/src/config.ts'
      - 'dashboard/frontend/src/components/Sidebar.tsx'
      - 'dashboard/frontend/src/components/EndToEndProof.tsx'
      - 'dashboard/frontend/src/components/SystemTruthControl.tsx'
      - 'dashboard/frontend/src/components/PaperTrading.tsx'
      - 'dashboard/frontend/src/components/BrokerPanel.tsx'
      - 'dashboard/backend/**'
      - 'core/data/**'
      - 'scripts/cloud_worker.py'
      - 'tools/package.json'
      - 'tools/frontend_no_fake_guard.mjs'
      - 'tools/dashboard_live_ui_proof.mjs'
      - 'tools/permanent_live_log_watch.mjs'
      - '.github/workflows/dashboard-live-proof.yml'
  schedule:
    - cron: "*/30 3-10 * * 1-5"

permissions:
  contents: read

env:
  SYSTEM3_MODE: analyzer
  ANALYZE_MODE: '1'
  LIVE_TRADING_ENABLED: '0'
  SYSTEM3_LIVE_TRADING_ALLOWED: '0'
  SYSTEM3_REAL_ONLY: '1'

jobs:
  dashboard-live-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DASHBOARD_BASE_URL: https://genesis-system3-web-doq2wplepa-el.a.run.app
      DASHBOARD_API_KEY: ${{ secrets.DASHBOARD_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          npm --prefix tools install --no-save --no-package-lock playwright
          npm --prefix tools exec playwright install chromium

      - name: Frontend no fake hardcoded guard
        run: node tools/frontend_no_fake_guard.mjs

      - name: Capture live dashboard proof
        id: live
        continue-on-error: true
        run: node tools/dashboard_live_ui_proof.mjs

      - name: Permanent live log watch
        if: always()
        continue-on-error: true
        run: node tools/permanent_live_log_watch.mjs

      - name: Upload dashboard proof artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-live-ui-proof
          path: |
            reports/latest/dashboard_live_ui_proof/
            reports/latest/permanent_live_log_watch/
          retention-days: 14

      - name: Enforce auth/session when API key is configured
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          key = (os.environ.get('DASHBOARD_API_KEY') or '').strip()
          p = Path('reports/latest/dashboard_live_ui_proof/summary.json')
          if not p.exists():
              raise SystemExit('live UI proof summary missing')
          data = json.loads(p.read_text(encoding='utf-8'))
          auth = data.get('auth') or {}
          if key and auth.get('ok') is not True:
              raise SystemExit(f"auth failed: {auth}")
          print({'auth_ok': bool(auth.get('ok')), 'infra': data.get('infra_blockers'), 'visual': data.get('visual_blockers')})
          PY