name: GCP Authority Repair

on:
  workflow_run:
    workflows: ["Cloud Run Auto Deploy"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: gcp-authority-repair
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  statuses: write

env:
  GOOGLE_CLOUD_PROJECT: system3-openalgo-safe
  GCP_WIF_PROVIDER: projects/802404398783/locations/global/workloadIdentityPools/github-genesis-system3/providers/github
  GCP_IAM_REPAIR_PRIMARY: gs3-iam-repair@system3-openalgo-safe.iam.gserviceaccount.com
  GCP_IAM_REPAIR_FALLBACK: gs3-iam-repair-b@system3-openalgo-safe.iam.gserviceaccount.com

jobs:
  primary-repair:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.result.outputs.changed }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Authenticate primary repair identity with keyless WIF
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.GOOGLE_CLOUD_PROJECT }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_IAM_REPAIR_PRIMARY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Static authority safety contract
        run: |
          python -m compileall -q scripts/gcp_authority_repair.py scripts/gcp_evidence_reader_access_repair.py
          python -m unittest -q tests.test_gcp_authority_repair_contract tests.test_gcp_evidence_reader_access_repair

      - name: Reconcile declared System3 IAM baseline
        run: python scripts/gcp_authority_repair.py --apply

      - name: Reconcile Ultra MRI evidence-reader viewer baseline
        run: python scripts/gcp_evidence_reader_access_repair.py --apply

      - name: Publish repair result
        id: result
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          a = json.loads(Path("reports/latest/gcp_authority_repair/summary.json").read_text())
          e = json.loads(Path("reports/latest/gcp_evidence_reader_access_repair/summary.json").read_text())
          assert a["secret_payloads_accessed"] is False
          assert a["service_account_keys_created"] is False
          assert a["dhan_rotation_job_executed"] is False
          assert a["live_trading_changed"] is False
          assert a["order_action_performed"] is False
          assert e["secret_payloads_accessed"] is False
          assert e["service_account_keys_created"] is False
          assert e["live_trading_changed"] is False
          assert e["order_action_performed"] is False
          changed = a["change_count"] > 0 or bool(e["changed_roles"])
          print(f"changed={'true' if changed else 'false'}")
          PY

      - name: Upload sanitized authority repair proof
        uses: actions/upload-artifact@v4
        with:
          name: gcp-authority-repair-primary-${{ github.run_number }}
          path: |
            reports/latest/gcp_authority_repair/summary.json
            reports/latest/gcp_evidence_reader_access_repair/summary.json
          if-no-files-found: error
          retention-days: 14

  fallback-repair:
    needs: primary-repair
    if: >-
      always() && needs.primary-repair.result == 'failure' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.result.outputs.changed }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Authenticate fallback repair identity with keyless WIF
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.GOOGLE_CLOUD_PROJECT }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_IAM_REPAIR_FALLBACK }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Static authority safety contract
        run: |
          python -m compileall -q scripts/gcp_authority_repair.py scripts/gcp_evidence_reader_access_repair.py
          python -m unittest -q tests.test_gcp_authority_repair_contract tests.test_gcp_evidence_reader_access_repair

      - name: Reconcile declared System3 IAM baseline
        run: python scripts/gcp_authority_repair.py --apply

      - name: Reconcile Ultra MRI evidence-reader viewer baseline
        run: python scripts/gcp_evidence_reader_access_repair.py --apply

      - name: Publish repair result
        id: result
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          a = json.loads(Path("reports/latest/gcp_authority_repair/summary.json").read_text())
          e = json.loads(Path("reports/latest/gcp_evidence_reader_access_repair/summary.json").read_text())
          assert a["secret_payloads_accessed"] is False
          assert a["service_account_keys_created"] is False
          assert a["dhan_rotation_job_executed"] is False
          assert a["live_trading_changed"] is False
          assert a["order_action_performed"] is False
          assert e["secret_payloads_accessed"] is False
          assert e["service_account_keys_created"] is False
          assert e["live_trading_changed"] is False
          assert e["order_action_performed"] is False
          changed = a["change_count"] > 0 or bool(e["changed_roles"])
          print(f"changed={'true' if changed else 'false'}")
          PY

      - name: Upload sanitized authority repair proof
        uses: actions/upload-artifact@v4
        with:
          name: gcp-authority-repair-fallback-${{ github.run_number }}
          path: |
            reports/latest/gcp_authority_repair/summary.json
            reports/latest/gcp_evidence_reader_access_repair/summary.json
          if-no-files-found: error
          retention-days: 14

  retry-deploy-once:
    needs: [primary-repair, fallback-repair]
    if: >-
      always() &&
      (needs.primary-repair.outputs.changed == 'true' || needs.fallback-repair.outputs.changed == 'true')
    uses: ./.github/workflows/cloud-run-auto-deploy.yml
