name: System3 Ultra MRI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/system3_ultra_mri.py"
      - ".github/workflows/system3-ultra-mri.yml"
  push:
    branches: [main]
    paths:
      - "scripts/system3_ultra_mri.py"
      - ".github/workflows/system3-ultra-mri.yml"

permissions:
  contents: read
  id-token: write
  actions: read

concurrency:
  group: system3-ultra-mri-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ultra-mri:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOGLE_CLOUD_PROJECT: system3-openalgo-safe
      GCP_REGION: asia-south1
      GCP_CLOUD_RUN_SERVICE: genesis-system3-web
      GCP_WIF_PROVIDER: projects/802404398783/locations/global/workloadIdentityPools/github-genesis-system3/providers/github
      GCP_DEPLOY_SERVICE_ACCOUNT: genesis-system3-automation@system3-openalgo-safe.iam.gserviceaccount.com
      CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
      SYSTEM3_ULTRA_MRI_OUT: reports/latest/system3_ultra_mri
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud with canonical keyless WIF
        id: auth
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GOOGLE_CLOUD_PROJECT }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        continue-on-error: true
        uses: google-github-actions/setup-gcloud@v3

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install read-only proof dependencies
        run: python -m pip install --disable-pip-version-check "requests>=2.31.0" "selenium>=4.20.0"

      - name: Run System3 Ultra MRI
        id: mri
        run: python scripts/system3_ultra_mri.py

      - name: Add workflow/auth status to verdict pack
        if: always()
        shell: bash
        run: |
          mkdir -p "${SYSTEM3_ULTRA_MRI_OUT}"
          cat > "${SYSTEM3_ULTRA_MRI_OUT}/WORKFLOW_CONTEXT.txt" <<EOF
          workflow=${GITHUB_WORKFLOW}
          run_id=${GITHUB_RUN_ID}
          run_number=${GITHUB_RUN_NUMBER}
          event=${GITHUB_EVENT_NAME}
          ref=${GITHUB_REF}
          sha=${GITHUB_SHA}
          gcp_auth_outcome=${{ steps.auth.outcome }}
          mri_step_outcome=${{ steps.mri.outcome }}
          EOF

      - name: Upload complete Ultra MRI evidence pack
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: system3-ultra-mri-${{ github.run_number }}
          path: |
            reports/latest/system3_ultra_mri/
            reports/latest/public_dashboard_proof/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish concise job summary
        if: always()
        shell: bash
        run: |
          echo "# System3 Ultra MRI" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "${SYSTEM3_ULTRA_MRI_OUT}/FINAL_VERDICT.md" ]; then
            cat "${SYSTEM3_ULTRA_MRI_OUT}/FINAL_VERDICT.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "MRI did not produce FINAL_VERDICT.md; inspect workflow and artifact evidence." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail closed when critical access is not certified
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("reports/latest/system3_ultra_mri/FINAL_VERDICT.json")
          if not p.exists():
              raise SystemExit("ULTRA_MRI_VERDICT_MISSING")
          data = json.loads(p.read_text(encoding="utf-8"))
          if not data.get("access_certified"):
              raise SystemExit("ULTRA_MRI_ACCESS_NOT_CERTIFIED")
          print("ULTRA_MRI_ACCESS_CERTIFIED")
          PY
