name: GCP Dhan Token Fix CI

on:
  push:
    branches:
      - "fix/gcp-dhan-token-rotation-ui-proof-*"
  pull_request:
    paths:
      - "core/brokers/dhan/**"
      - "core/utils/env_loader.py"
      - "scripts/start_cloud_run.py"
      - "scripts/gcp_dhan_token_rotation_job.py"
      - "scripts/gcp_cloud_run_auto_deploy.py"
      - "scripts/gcp_failed_revision_forensic.py"
      - "scripts/codespace_startup.sh"
      - "scripts/cloud_worker.py"
      - "scripts/system3_self_healing_watchdog.py"
      - "tools/sync_render_secrets.py"
      - "dashboard/backend/**"
      - "dashboard/frontend/**"
      - "deploy/gcp/bootstrap_github_wif.sh"
      - "tests/test_gcp_dhan_token_rotation_contract.py"
      - "tests/test_gcp_rotator_identity_contract.py"
      - "tests/test_dhan_single_token_authority.py"
      - ".github/workflows/cloud-run-auto-deploy.yml"
      - ".github/workflows/gcp-dhan-token-rotation.yml"
      - ".github/workflows/gcp-dhan-token-fix-ci.yml"

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJECT_ID: system3-openalgo-safe
      REGION: asia-south1
      SERVICE: genesis-system3-web
      ROTATION_JOB: genesis-system3-dhan-token-rotate
      WIF_PROVIDER: projects/802404398783/locations/global/workloadIdentityPools/github-genesis-system3/providers/github
      DEPLOY_SA: genesis-system3-automation@system3-openalgo-safe.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python compile and single-authority contracts
        run: |
          python -m compileall -q core dashboard scripts tests
          python -m unittest -v \
            tests.test_gcp_dhan_token_rotation_contract \
            tests.test_gcp_rotator_identity_contract \
            tests.test_dhan_single_token_authority

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/frontend/package-lock.json

      - name: Frontend production build
        working-directory: dashboard/frontend
        run: |
          npm ci --legacy-peer-deps
          npm run build
          grep -R -q "TOKEN ROTATION PROOF" dist/assets

      - name: Analyzer-only safety grep
        run: |
          ! grep -R -nE "LIVE_TRADING_ENABLED.?=.?1|SYSTEM3_LIVE_TRADING_ALLOWED.?=.?1|AUTO_EXECUTE_TRADES.?=.?1" \
            core/brokers/dhan/cloud_token_provider.py \
            core/brokers/dhan/cloud_runtime_patch.py \
            scripts/start_cloud_run.py \
            scripts/gcp_dhan_token_rotation_job.py

      - name: Authenticate to Google Cloud with keyless WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Capture sanitized latest revision startup forensics
        env:
          FAILED_REVISION: genesis-system3-web-00209-buz
        run: |
          python scripts/gcp_failed_revision_forensic.py

      - name: Prove keyless Google identity and Cloud Run read access
        run: |
          set -euo pipefail
          ACTIVE=$(gcloud auth list --filter=status:ACTIVE --format='value(account)')
          test "${ACTIVE}" = "${DEPLOY_SA}"
          gcloud run services describe "${SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --format='value(metadata.name,status.latestReadyRevisionName,status.url)' \
            > /tmp/service.txt
          test -s /tmp/service.txt
          echo "WIF_AUTHENTICATION_OK account=${ACTIVE}"
          cat /tmp/service.txt

      - name: Inventory broker token authorities without secret payloads
        run: |
          set -euo pipefail
          echo "=== CLOUD RUN JOBS ==="
          gcloud run jobs list \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --format='table(metadata.name,status.conditions[0].status)' || true

          echo "=== CLOUD SCHEDULERS ==="
          gcloud scheduler jobs list \
            --project="${PROJECT_ID}" \
            --location="${REGION}" \
            --format='table(name.basename(),schedule,timeZone,state)' || true

          echo "=== DHAN TOKEN SECRET VERSION METADATA ==="
          gcloud secrets versions list dhan-access-token \
            --project="${PROJECT_ID}" \
            --limit=10 \
            --format='table(name,state,createTime)' || true

          echo "=== ROTATION EXECUTION METADATA ==="
          gcloud run jobs executions list \
            --job="${ROTATION_JOB}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --limit=10 \
            --format='table(metadata.name,metadata.creationTimestamp,status.conditions[0].status,status.conditions[0].message)' || true

          gcloud run services describe "${SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --format=json > /tmp/service.json
          jq '{latestReadyRevision:.status.latestReadyRevisionName,serviceAccount:.spec.template.spec.serviceAccountName,safeEnv:[.spec.template.spec.containers[].env[]? | select(.name=="DHAN_TOKEN_SOURCE" or .name=="DHAN_ACCESS_TOKEN_SECRET_ID" or .name=="DHAN_TOKEN_ROTATION_JOB" or .name=="DHAN_TOKEN_ROTATION_SCHEDULE" or .name=="DHAN_STATUS_AUTO_REFRESH" or .name=="SYSTEM3_STARTUP_TOKEN_REFRESH" or .name=="BROKER_SELF_HEAL_TOKEN_REFRESH" or .name=="DHAN_CANONICAL_ROTATION_SELF_HEAL" or .name=="DHAN_CANONICAL_ROTATION_COOLDOWN_S" or .name=="LIVE_TRADING_ENABLED" or .name=="SYSTEM3_LIVE_TRADING_ALLOWED" or .name=="AUTO_EXECUTE_TRADES") | {name,value}]}' /tmp/service.json

          RUNTIME_SA=$(jq -r '.spec.template.spec.serviceAccountName // ""' /tmp/service.json)
          test -n "${RUNTIME_SA}"
          SCHEDULER_SA="gs3-scheduler@${PROJECT_ID}.iam.gserviceaccount.com"
          RECOVERY_SA="gs3-token-recovery@${PROJECT_ID}.iam.gserviceaccount.com"
          gcloud run jobs get-iam-policy "${ROTATION_JOB}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --format=json > /tmp/rotation-job-iam.json

          # Negative: web runtime must NOT invoke the Dhan rotator.
          if jq -e --arg member "serviceAccount:${RUNTIME_SA}" \
            '.bindings[]? | select(.role=="roles/run.invoker") | .members[]? | select(.==$member)' \
            /tmp/rotation-job-iam.json >/dev/null; then
            echo "WEB_RUNTIME_CAN_INVOKE_DHAN_ROTATOR=true service_account=${RUNTIME_SA}" >&2
            exit 1
          fi
          echo "WEB_RUNTIME_CANNOT_INVOKE_DHAN_ROTATOR service_account=${RUNTIME_SA}"

          jq -e --arg member "serviceAccount:${SCHEDULER_SA}" \
            '.bindings[]? | select(.role=="roles/run.invoker") | .members[]? | select(.==$member)' \
            /tmp/rotation-job-iam.json >/dev/null
          echo "SCHEDULER_CAN_INVOKE_DHAN_ROTATOR service_account=${SCHEDULER_SA}"

          jq -e --arg member "serviceAccount:${RECOVERY_SA}" \
            '.bindings[]? | select(.role=="roles/run.invoker") | .members[]? | select(.==$member)' \
            /tmp/rotation-job-iam.json >/dev/null
          echo "MANUAL_RECOVERY_IDENTITY_CAN_INVOKE_DHAN_ROTATOR service_account=${RECOVERY_SA}"

          # Negative effective-permission probe for web identity (IAM policy truth).
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          project = os.environ["PROJECT_ID"]
          policy = json.loads(Path("/tmp/rotation-job-iam.json").read_text(encoding="utf-8"))
          svc = json.loads(Path("/tmp/service.json").read_text(encoding="utf-8"))
          runtime = (
              ((svc.get("spec") or {}).get("template") or {}).get("spec") or {}
          ).get("serviceAccountName") or ""
          members = set()
          for binding in policy.get("bindings") or []:
              if binding.get("role") == "roles/run.invoker":
                  members.update(binding.get("members") or [])
          web_member = f"serviceAccount:{runtime}"
          assert web_member not in members, f"web still has run.invoker: {web_member}"
          assert f"serviceAccount:gs3-scheduler@{project}.iam.gserviceaccount.com" in members
          assert f"serviceAccount:gs3-token-recovery@{project}.iam.gserviceaccount.com" in members
          print("NEGATIVE_EFFECTIVE_PERMISSION_TEST_WEB_RUNTIME_PASS")
          PY

      - name: Classify broker runtime truth without production mutation
        run: |
          set -euo pipefail
          URL=$(gcloud run services describe "${SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --format='value(status.url)')

          curl -fsS --max-time 30 "${URL}/api/broker/status" > /tmp/broker-status.json
          jq '{connected,error,latency_ms,token_proof:{source:.token_proof.source,secret_id:.token_proof.secret_id,secret_version:.token_proof.secret_version,expires_at_utc:.token_proof.expires_at_utc,hours_remaining:.token_proof.hours_remaining,last_reload_reason:.token_proof.last_reload_reason,last_error_type:.token_proof.last_error_type,token_value_exposed:.token_proof.token_value_exposed},live_trading_enabled,order_placement_allowed}' /tmp/broker-status.json

          # PR verification is read-only against production. It may classify a
          # runtime broker/token problem, but it must never rotate a secret or
          # execute the production rotator merely to make a pull request green.
          jq -e '.token_proof.token_value_exposed == false and .live_trading_enabled == false and .order_placement_allowed == false' /tmp/broker-status.json >/dev/null
          jq -e '.token_proof.source == "GCP_SECRET_MANAGER_DYNAMIC"' /tmp/broker-status.json >/dev/null

          if jq -e '.connected == true and .error == null' /tmp/broker-status.json >/dev/null; then
            echo "BROKER_RUNTIME_TRUTH=CONNECTED_READ_ONLY"
          else
            ERROR=$(jq -r '.error // "UNKNOWN"' /tmp/broker-status.json)
            echo "BROKER_RUNTIME_TRUTH=DEGRADED_READ_ONLY error=${ERROR}"
            echo "BROKER_REMEDIATION_REQUIRED=YES"
            echo "PR_MUTATION_ATTEMPTED=NO"
          fi
