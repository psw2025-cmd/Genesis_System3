name: GCP Dhan Token Fix CI

on:
  push:
    branches:
      - "fix/gcp-dhan-token-rotation-ui-proof-*"
  pull_request:
    paths:
      - "core/brokers/dhan/**"
      - "core/utils/env_loader.py"
      - "scripts/start_cloud_run.py"
      - "scripts/gcp_dhan_token_rotation_job.py"
      - "dashboard/backend/**"
      - "dashboard/frontend/**"
      - "tests/test_gcp_dhan_token_rotation_contract.py"
      - ".github/workflows/cloud-run-auto-deploy.yml"
      - ".github/workflows/gcp-dhan-token-rotation.yml"
      - ".github/workflows/gcp-dhan-token-fix-ci.yml"

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PROJECT_ID: system3-openalgo-safe
      REGION: asia-south1
      SERVICE: genesis-system3-web
      WIF_PROVIDER: projects/802404398783/locations/global/workloadIdentityPools/github-genesis-system3/providers/github
      DEPLOY_SA: genesis-system3-automation@system3-openalgo-safe.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python compile and unit contracts
        run: |
          python -m compileall -q core dashboard scripts tests
          python -m unittest -v tests.test_gcp_dhan_token_rotation_contract

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/frontend/package-lock.json

      - name: Frontend production build
        working-directory: dashboard/frontend
        run: |
          npm ci --legacy-peer-deps
          npm run build
          grep -R -q "TOKEN ROTATION PROOF" dist/assets

      - name: Analyzer-only safety grep
        run: |
          ! grep -R -nE "LIVE_TRADING_ENABLED.?=.?1|SYSTEM3_LIVE_TRADING_ALLOWED.?=.?1|AUTO_EXECUTE_TRADES.?=.?1" \
            core/brokers/dhan/cloud_token_provider.py \
            core/brokers/dhan/cloud_runtime_patch.py \
            scripts/start_cloud_run.py \
            scripts/gcp_dhan_token_rotation_job.py

      - name: Authenticate to Google Cloud with keyless WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Prove keyless Google identity and Cloud Run read access
        run: |
          set -euo pipefail
          ACTIVE=$(gcloud auth list --filter=status:ACTIVE --format='value(account)')
          test "${ACTIVE}" = "${DEPLOY_SA}"
          gcloud run services describe "${SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --format='value(metadata.name,status.latestReadyRevisionName,status.url)' \
            > /tmp/service.txt
          test -s /tmp/service.txt
          echo "WIF_AUTHENTICATION_OK account=${ACTIVE}"
          cat /tmp/service.txt

      - name: Inventory broker token authorities without secret payloads
        run: |
          set -euo pipefail
          echo "=== CLOUD RUN JOBS ==="
          gcloud run jobs list \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --format='table(metadata.name,status.conditions[0].status)' || true

          echo "=== CLOUD SCHEDULERS ==="
          gcloud scheduler jobs list \
            --project="${PROJECT_ID}" \
            --location="${REGION}" \
            --format='table(name.basename(),schedule,timeZone,state)' || true

          echo "=== DHAN TOKEN SECRET VERSION METADATA ==="
          gcloud secrets versions list dhan-access-token \
            --project="${PROJECT_ID}" \
            --limit=10 \
            --format='table(name,state,createTime)' || true

          echo "=== ROTATION EXECUTION METADATA ==="
          gcloud run jobs executions list \
            --job=genesis-system3-dhan-token-rotate \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --limit=10 \
            --format='table(metadata.name,metadata.creationTimestamp,status.conditions[0].status,status.conditions[0].message)' || true

          gcloud run services describe "${SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --format=json > /tmp/service.json
          jq '{latestReadyRevision:.status.latestReadyRevisionName,serviceAccount:.spec.template.spec.serviceAccountName,safeEnv:[.spec.template.spec.containers[].env[]? | select(.name=="DHAN_TOKEN_SOURCE" or .name=="DHAN_ACCESS_TOKEN_SECRET_ID" or .name=="DHAN_TOKEN_ROTATION_JOB" or .name=="DHAN_TOKEN_ROTATION_SCHEDULE" or .name=="DHAN_STATUS_AUTO_REFRESH" or .name=="SYSTEM3_STARTUP_TOKEN_REFRESH" or .name=="BROKER_SELF_HEAL_TOKEN_REFRESH" or .name=="LIVE_TRADING_ENABLED" or .name=="SYSTEM3_LIVE_TRADING_ALLOWED" or .name=="AUTO_EXECUTE_TRADES") | {name,value}]}' /tmp/service.json

      - name: Prove broker read-only safety and LIVE lock
        run: |
          set -euo pipefail
          URL=$(gcloud run services describe "${SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --format='value(status.url)')
          curl -fsS --max-time 30 "${URL}/api/broker/status" > /tmp/broker.json
          jq '{connected,error,latency_ms,auto_refresh,token_reload,token_proof:{source:.token_proof.source,secret_id:.token_proof.secret_id,secret_version:.token_proof.secret_version,expires_at_utc:.token_proof.expires_at_utc,hours_remaining:.token_proof.hours_remaining,last_reload_reason:.token_proof.last_reload_reason,last_error_type:.token_proof.last_error_type,token_value_exposed:.token_proof.token_value_exposed},live_trading_enabled,order_placement_allowed}' /tmp/broker.json
          jq -e '.token_proof.source == "GCP_SECRET_MANAGER_DYNAMIC"' /tmp/broker.json >/dev/null
          jq -e '.token_proof.token_value_exposed == false' /tmp/broker.json >/dev/null
          jq -e '.live_trading_enabled == false' /tmp/broker.json >/dev/null
          jq -e '.order_placement_allowed == false' /tmp/broker.json >/dev/null
          jq -e '.connected == true' /tmp/broker.json >/dev/null
          echo "WIF_RUNTIME_SAFETY_OK"
