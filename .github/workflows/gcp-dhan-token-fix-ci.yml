name: GCP Dhan Token Fix CI

on:
  push:
    branches:
      - main
      - "fix/gcp-dhan-token-rotation-ui-proof-*"
      - "fix/br1-dhan-rejection-backoff"
      - "fix/br1-current-main-rebuild-*"
    paths:
      - "core/brokers/dhan/**"
      - "core/utils/env_loader.py"
      - "scripts/start_cloud_run.py"
      - "scripts/gcp_dhan_token_rotation_job.py"
      - "scripts/gcp_cloud_run_auto_deploy.py"
      - "scripts/gcp_failed_revision_forensic.py"
      - "scripts/codespace_startup.sh"
      - "scripts/cloud_worker.py"
      - "scripts/system3_self_healing_watchdog.py"
      - "dashboard/backend/**"
      - "dashboard/frontend/**"
      - "deploy/gcp/bootstrap_github_wif.sh"
      - "tests/test_gcp_dhan_token_rotation_contract.py"
      - "tests/test_gcp_rotator_identity_contract.py"
      - "tests/test_dhan_single_token_authority.py"
      - "tests/test_br1_dhan_auth_reliability.py"
      - "tests/test_broker_auth_permanent_fix.py"
      - ".github/workflows/cloud-run-auto-deploy.yml"
      - ".github/workflows/gcp-dhan-token-rotation.yml"
  pull_request:
    paths:
      - "core/brokers/dhan/**"
      - "core/utils/env_loader.py"
      - "scripts/start_cloud_run.py"
      - "scripts/gcp_dhan_token_rotation_job.py"
      - "scripts/gcp_cloud_run_auto_deploy.py"
      - "scripts/gcp_failed_revision_forensic.py"
      - "scripts/codespace_startup.sh"
      - "scripts/cloud_worker.py"
      - "scripts/system3_self_healing_watchdog.py"
      - "dashboard/backend/**"
      - "dashboard/frontend/**"
      - "deploy/gcp/bootstrap_github_wif.sh"
      - "tests/test_gcp_dhan_token_rotation_contract.py"
      - "tests/test_gcp_rotator_identity_contract.py"
      - "tests/test_dhan_single_token_authority.py"
      - "tests/test_br1_dhan_auth_reliability.py"
      - "tests/test_broker_auth_permanent_fix.py"
      - ".github/workflows/cloud-run-auto-deploy.yml"
      - ".github/workflows/gcp-dhan-token-rotation.yml"
      - ".github/workflows/gcp-dhan-token-fix-ci.yml"
  workflow_run:
    workflows:
      - Cloud Run Auto Deploy
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJECT_ID: system3-openalgo-safe
      REGION: asia-south1
      SERVICE: genesis-system3-web
      ROTATION_JOB: genesis-system3-dhan-token-rotate
      WIF_PROVIDER: projects/802404398783/locations/global/workloadIdentityPools/github-genesis-system3/providers/github
      DEPLOY_SA: genesis-system3-automation@system3-openalgo-safe.iam.gserviceaccount.com
      EXPECTED_RUNTIME_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ env.EXPECTED_RUNTIME_SHA }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install explicit Python contract-test dependencies
        run: python -m pip install --disable-pip-version-check --no-input "python-dotenv==1.1.1"

      - name: Python compile and single-authority contracts
        run: |
          python -m compileall -q core dashboard scripts tests
          python -m unittest -v \
            tests.test_gcp_dhan_token_rotation_contract \
            tests.test_gcp_rotator_identity_contract \
            tests.test_dhan_single_token_authority \
            tests.test_br1_dhan_auth_reliability \
            tests.test_broker_auth_permanent_fix

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/frontend/package-lock.json

      - name: Frontend production build
        working-directory: dashboard/frontend
        run: |
          npm ci --legacy-peer-deps
          npm run build
          grep -R -q "TOKEN ROTATION PROOF" dist/assets

      - name: Analyzer-only safety grep
        run: |
          ! grep -R -nE "LIVE_TRADING_ENABLED.?=.?1|SYSTEM3_LIVE_TRADING_ALLOWED.?=.?1|AUTO_EXECUTE_TRADES.?=.?1" \
            core/brokers/dhan/cloud_token_provider.py \
            core/brokers/dhan/cloud_runtime_patch.py \
            scripts/start_cloud_run.py \
            scripts/gcp_dhan_token_rotation_job.py

      - name: Source-only boundary before deployment
        if: github.event_name != 'workflow_run'
        run: |
          echo "GCP_LIVE_PROOF=DEFERRED_TO_CLOUD_RUN_AUTO_DEPLOY_WORKFLOW_RUN"
          echo "WIF_POLICY=POST_DEPLOY_MAIN_ONLY"
          echo "LOCAL_DHAN_CONTRACTS=PASS"

      - name: Authenticate to Google Cloud with keyless WIF
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - name: Set up Cloud SDK
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
        uses: google-github-actions/setup-gcloud@v3

      - name: Prove exact serving SHA and runtime contract
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
        run: |
          set -euo pipefail
          ACTIVE=$(gcloud auth list --filter=status:ACTIVE --format='value(account)')
          test "${ACTIVE}" = "${DEPLOY_SA}"
          gcloud run services describe "${SERVICE}" --project="${PROJECT_ID}" --region="${REGION}" --format=json > /tmp/service.json
          SERVING_REVISION=$(jq -r '[.status.traffic[]? | select((.percent // 0) == 100) | .revisionName][0] // ""' /tmp/service.json)
          DEPLOY_SHA=$(jq -r '[.spec.template.spec.containers[].env[]? | select(.name=="DEPLOY_GIT_SHA") | .value][0] // ""' /tmp/service.json)
          test -n "${SERVING_REVISION}"
          test "${DEPLOY_SHA}" = "${EXPECTED_RUNTIME_SHA}"
          jq -e '[.spec.template.spec.containers[].env[]? | select(.name=="DHAN_TOKEN_SOURCE" and .value=="gcp-secret-manager-dynamic")] | length == 1' /tmp/service.json >/dev/null
          jq -e '[.spec.template.spec.containers[].env[]? | select(.name=="DHAN_ACCESS_TOKEN_SECRET_ID" and .value=="dhan-access-token")] | length == 1' /tmp/service.json >/dev/null
          jq -e '[.spec.template.spec.containers[].env[]? | select(.name=="DHAN_CANONICAL_ROTATION_SELF_HEAL" and .value=="0")] | length == 1' /tmp/service.json >/dev/null
          jq -e '[.spec.template.spec.containers[].env[]? | select(.name=="DHAN_STATUS_AUTO_REFRESH" and .value=="0")] | length == 1' /tmp/service.json >/dev/null
          jq -e '[.spec.template.spec.containers[].env[]? | select(.name=="SYSTEM3_STARTUP_TOKEN_REFRESH" and .value=="0")] | length == 1' /tmp/service.json >/dev/null
          jq -e '[.spec.template.spec.containers[].env[]? | select(.name=="BROKER_SELF_HEAL_TOKEN_REFRESH" and .value=="0")] | length == 1' /tmp/service.json >/dev/null
          jq -e '[.spec.template.spec.containers[].env[]? | select((.name=="LIVE_TRADING_ENABLED" or .name=="SYSTEM3_LIVE_TRADING_ALLOWED" or .name=="AUTO_EXECUTE_TRADES") and .value=="0")] | length == 3' /tmp/service.json >/dev/null
          echo "EXACT_SERVING_SHA_PASS revision=${SERVING_REVISION} sha=${DEPLOY_SHA}"

      - name: Prove scheduler-only token authority
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
        run: |
          set -euo pipefail
          RUNTIME_SA=$(jq -r '.spec.template.spec.serviceAccountName // ""' /tmp/service.json)
          SCHEDULER_SA="gs3-scheduler@${PROJECT_ID}.iam.gserviceaccount.com"
          RECOVERY_SA="gs3-token-recovery@${PROJECT_ID}.iam.gserviceaccount.com"
          test -n "${RUNTIME_SA}"
          gcloud run jobs get-iam-policy "${ROTATION_JOB}" --project="${PROJECT_ID}" --region="${REGION}" --format=json > /tmp/rotation-job-iam.json
          if jq -e --arg member "serviceAccount:${RUNTIME_SA}" '.bindings[]? | select(.role=="roles/run.invoker") | .members[]? | select(.==$member)' /tmp/rotation-job-iam.json >/dev/null; then
            echo "WEB_RUNTIME_CAN_INVOKE_DHAN_ROTATOR=true service_account=${RUNTIME_SA}" >&2
            exit 1
          fi
          jq -e --arg member "serviceAccount:${SCHEDULER_SA}" '.bindings[]? | select(.role=="roles/run.invoker") | .members[]? | select(.==$member)' /tmp/rotation-job-iam.json >/dev/null
          jq -e --arg member "serviceAccount:${RECOVERY_SA}" '.bindings[]? | select(.role=="roles/run.invoker") | .members[]? | select(.==$member)' /tmp/rotation-job-iam.json >/dev/null
          SCHEDULE=$(gcloud scheduler jobs describe genesis-system3-dhan-token-rotate-daily --project="${PROJECT_ID}" --location="${REGION}" --format='value(schedule)')
          TIMEZONE=$(gcloud scheduler jobs describe genesis-system3-dhan-token-rotate-daily --project="${PROJECT_ID}" --location="${REGION}" --format='value(timeZone)')
          test "${SCHEDULE}" = "*/5 * * * *"
          test "${TIMEZONE}" = "Asia/Kolkata"
          echo "SCHEDULER_ONLY_ROTATION_AUTHORITY_PASS schedule=${SCHEDULE} timezone=${TIMEZONE}"

      - name: Prove strict broker truth after exact deployment
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
        run: |
          set -euo pipefail
          URL=$(jq -r '.status.url // ""' /tmp/service.json)
          test -n "${URL}"
          curl -fsS --max-time 30 "${URL}/api/broker/status" > /tmp/broker-status.json
          jq '{connected,error,broker_truth_contract,broker_truth_complete,account_read_proof,token_proof:{source:.token_proof.source,secret_id:.token_proof.secret_id,secret_version:.token_proof.secret_version,last_reload_reason:.token_proof.last_reload_reason,last_error_type:.token_proof.last_error_type,token_value_exposed:.token_proof.token_value_exposed},live_trading_enabled,order_placement_allowed}' /tmp/broker-status.json
          jq -e '.connected == true and .error == null' /tmp/broker-status.json >/dev/null
          jq -e '.broker_truth_contract == "profile+funds+holdings+positions" and .broker_truth_complete == true' /tmp/broker-status.json >/dev/null
          jq -e '.account_read_proof.profile.ok == true and .account_read_proof.funds.ok == true and .account_read_proof.holdings.ok == true and .account_read_proof.positions.ok == true' /tmp/broker-status.json >/dev/null
          jq -e '.token_proof.source == "GCP_SECRET_MANAGER_DYNAMIC" and .token_proof.token_value_exposed == false' /tmp/broker-status.json >/dev/null
          jq -e '.live_trading_enabled == false and .order_placement_allowed == false' /tmp/broker-status.json >/dev/null
          sleep 10
          curl -fsS --max-time 30 "${URL}/api/broker/status" > /tmp/broker-status-2.json
          jq -e '.connected == true and .error == null and .broker_truth_complete == true' /tmp/broker-status-2.json >/dev/null
          echo "STRICT_BROKER_RUNTIME_TRUTH=PASS"
