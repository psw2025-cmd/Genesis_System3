name: Ten Minute PAPER Reality Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'dashboard/backend/paper_pipeline_v8.py'
      - 'tests/test_paper_*.py'
      - '.github/workflows/ten-minute-paper-gate.yml'

permissions:
  contents: read

concurrency:
  group: ten-minute-paper-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actual-paper-pipeline:
    name: Actual PAPER pipeline fast failure gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PAPER_MODE: '1'
      ANALYZE_MODE: '1'
      LIVE_TRADING_ENABLED: '0'
      SYSTEM3_LIVE_TRADING_ALLOWED: '0'
      LIVE_ORDER_AUTHORITY: '0'
      AUTO_EXECUTE_TRADES: '0'
      ORDER_PLACEMENT_ALLOWED: 'false'
      USE_LIVE_EXECUTION_ENGINE: '0'
      CLOUD_PAPER_ENGINE: '0'
      REAL_BROKER_ORDERS: '0'
      TRADING_CAPITAL_LIMIT_INR: '50000'
      DAILY_STOP_LOSS_LIMIT_INR: '5000'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install pytest pandas
      - name: Verify execution locks before tests
        run: |
          python - <<'PY'
          import os
          expected = {
              "PAPER_MODE":"1", "ANALYZE_MODE":"1",
              "LIVE_TRADING_ENABLED":"0", "SYSTEM3_LIVE_TRADING_ALLOWED":"0",
              "LIVE_ORDER_AUTHORITY":"0", "AUTO_EXECUTE_TRADES":"0",
              "ORDER_PLACEMENT_ALLOWED":"false", "USE_LIVE_EXECUTION_ENGINE":"0",
              "CLOUD_PAPER_ENGINE":"0", "REAL_BROKER_ORDERS":"0",
          }
          assert all(os.environ[k] == v for k,v in expected.items())
          print("PASS: all PAPER-only locks active")
          PY
      - name: Run real pipeline fast regression scenarios
        timeout-minutes: 7
        run: |
          python -m pytest -q -o addopts="" --tb=short \
            tests/test_paper_pipeline_v8_dhan_only.py \
            tests/test_paper_pipeline_ledger_integrity.py \
            tests/test_paper_selftest_truth.py \
            tests/test_paper_pipeline_market_entry_guards.py \
            tests/test_paper_pnl_summary_integrity.py \
            tests/test_paper_quote_provenance.py \
            tests/test_paper_ledger_read_integrity.py
      - name: Explicit certification scope
        if: always()
        run: |
          echo 'SCOPE: real paper_pipeline_v8 offline regression tests'
          echo 'NOT VERIFIED: historical 30-day replay, production UI/browser, real Dhan feed, model accuracy, complete closing fills'
          echo 'REAL BROKER ORDERS: DISABLED'
