name: Cloud Run Auto Deploy

# GitHub is the code source; Google Cloud is the runtime and scheduler.
on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "core/**"
      - "scripts/start_cloud_run.py"
      - "scripts/gcp_dhan_token_rotation_job.py"
      - "scripts/gcp_cloud_run_auto_deploy.py"
      - "scripts/gcp_runtime_evidence.py"
      - "scripts/sync_dhan_instruments_master.py"
      - "src/**"
      - "config/**"
      - "deploy/gcp/**"
      - ".github/workflows/cloud-run-auto-deploy.yml"
      - ".github/workflows/gcp-dhan-token-rotation.yml"
  workflow_dispatch:

concurrency:
  group: cloud-run-auto-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GOOGLE_CLOUD_PROJECT: system3-openalgo-safe
      GCP_REGION: asia-south1
      GCP_CLOUD_RUN_SERVICE: genesis-system3-web
      DHAN_ROTATION_JOB: genesis-system3-dhan-token-rotate
      DHAN_ROTATION_SCHEDULER: genesis-system3-dhan-token-rotate-daily
      CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
      API_KEY_SECRET_ID: ${{ vars.API_KEY_SECRET_ID || 'system3-dashboard-api-key' }}
      WORKER_PUSH_TOKEN_SECRET_ID: ${{ vars.WORKER_PUSH_TOKEN_SECRET_ID || 'system3-dashboard-worker-push-token' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud with keyless WIF
        if: ${{ vars.GCP_WIF_PROVIDER != '' && vars.GCP_DEPLOY_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GOOGLE_CLOUD_PROJECT }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Temporary legacy-key authentication fallback
        if: ${{ vars.GCP_WIF_PROVIDER == '' || vars.GCP_DEPLOY_SERVICE_ACCOUNT == '' }}
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Static safety and syntax gates
        run: |
          python -m compileall -q core dashboard scripts
          python - <<'PY'
          from pathlib import Path
          required = {
              "core/brokers/dhan/cloud_token_provider.py": "GCP_SECRET_MANAGER_DYNAMIC",
              "core/brokers/dhan/cloud_runtime_patch.py": "order_placement_allowed",
              "scripts/gcp_dhan_token_rotation_job.py": "order_endpoints_called",
              "scripts/gcp_runtime_evidence.py": "secret_values_exposed",
              "dashboard/frontend/src/components/BrokerProofPanel.tsx": "TOKEN ROTATION PROOF",
              "dashboard/backend/security_policy.py": "AUTH_REQUIRED_FOR_MUTATION",
          }
          for path, marker in required.items():
              text = Path(path).read_text(encoding="utf-8")
              assert marker in text, f"missing marker {marker} in {path}"
          assert 'LIVE_TRADING_ENABLED"] = "0"' in Path("scripts/gcp_dhan_token_rotation_job.py").read_text()
          print("STATIC_GATES_OK", sorted(required))
          PY

      - name: Verify required Secret Manager secrets exist (fail closed)
        run: |
          for SECRET in "${API_KEY_SECRET_ID}" "${WORKER_PUSH_TOKEN_SECRET_ID}"; do
            gcloud secrets describe "${SECRET}" --project="${GOOGLE_CLOUD_PROJECT}" >/dev/null \
              || { echo "Required secret '${SECRET}' does not exist in Secret Manager. Create it before deploying (see docs/security/SECURE_DEPLOYMENT_PREREQUISITES.md)." >&2; exit 1; }
          done

      - name: Build frontend proof
        working-directory: dashboard/frontend
        run: |
          npm ci --legacy-peer-deps
          npm run build
          grep -R -q "TOKEN ROTATION PROOF" dist/assets

      - name: Install deploy dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "google-auth>=2.28.0" "requests>=2.31.0"

      - name: Verify required Google Cloud APIs are available
        run: |
          gcloud run services describe "${GCP_CLOUD_RUN_SERVICE}" \
            --project="${GOOGLE_CLOUD_PROJECT}" \
            --region="${GCP_REGION}" \
            --format='value(metadata.name,status.url)' >/tmp/preflight-service.txt
          test -s /tmp/preflight-service.txt

      - name: Deploy guarded Cloud Run service
        run: python scripts/gcp_cloud_run_auto_deploy.py

      - name: Enforce dynamic token runtime and single active instance
        run: |
          gcloud run services update "${GCP_CLOUD_RUN_SERVICE}" \
            --project="${GOOGLE_CLOUD_PROJECT}" \
            --region="${GCP_REGION}" \
            --min-instances=0 \
            --max-instances=1 \
            --update-env-vars="REQUIRE_API_KEY=true,DHAN_TOKEN_SOURCE=gcp-secret-manager-dynamic,DHAN_ACCESS_TOKEN_SECRET_ID=dhan-access-token,DHAN_TOKEN_CACHE_TTL_S=30,DHAN_TOKEN_ROTATION_JOB=${DHAN_ROTATION_JOB},DHAN_TOKEN_ROTATION_SCHEDULE=07:30 IST daily,REQUIRE_API_KEY=true,LIVE_TRADING_ENABLED=0,SYSTEM3_LIVE_TRADING_ALLOWED=0,AUTO_EXECUTE_TRADES=0,ANALYZE_MODE=1,SYSTEM3_MODE=ANALYZER" \
            --update-secrets="API_KEY=${API_KEY_SECRET_ID}:latest,WORKER_PUSH_TOKEN=${WORKER_PUSH_TOKEN_SECRET_ID}:latest"

      - name: Configure rotator IAM, Cloud Run Job and Cloud Scheduler
        run: |
          RUNTIME_SA=$(gcloud run services describe "${GCP_CLOUD_RUN_SERVICE}" \
            --project="${GOOGLE_CLOUD_PROJECT}" \
            --region="${GCP_REGION}" \
            --format='value(spec.template.spec.serviceAccountName)')
          if [ -z "${RUNTIME_SA}" ]; then
            RUNTIME_SA=$(gcloud projects describe "${GOOGLE_CLOUD_PROJECT}" --format='value(projectNumber)')-compute@developer.gserviceaccount.com
          fi
          echo "RUNTIME_SERVICE_ACCOUNT=${RUNTIME_SA}" >> "$GITHUB_ENV"

          for SECRET in system3-dhan-client-id dhan-access-token dhan-pin dhan-totp-secret "${API_KEY_SECRET_ID}" "${WORKER_PUSH_TOKEN_SECRET_ID}"; do
            gcloud secrets add-iam-policy-binding "${SECRET}" \
              --project="${GOOGLE_CLOUD_PROJECT}" \
              --member="serviceAccount:${RUNTIME_SA}" \
              --role="roles/secretmanager.secretAccessor" \
              --quiet >/dev/null
          done
          gcloud secrets add-iam-policy-binding dhan-access-token \
            --project="${GOOGLE_CLOUD_PROJECT}" \
            --member="serviceAccount:${RUNTIME_SA}" \
            --role="roles/secretmanager.secretVersionAdder" \
            --quiet >/dev/null

          IMAGE=$(gcloud run services describe "${GCP_CLOUD_RUN_SERVICE}" \
            --project="${GOOGLE_CLOUD_PROJECT}" \
            --region="${GCP_REGION}" \
            --format='value(spec.template.spec.containers[0].image)')

          gcloud run jobs deploy "${DHAN_ROTATION_JOB}" \
            --project="${GOOGLE_CLOUD_PROJECT}" \
            --region="${GCP_REGION}" \
            --image="${IMAGE}" \
            --service-account="${RUNTIME_SA}" \
            --command=python \
            --args=scripts/gcp_dhan_token_rotation_job.py \
            --tasks=1 \
            --parallelism=1 \
            --max-retries=0 \
            --task-timeout=10m \
            --set-env-vars="GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT},CLOUD_MODE=1,DHAN_PERSIST_TOKEN_TO_SM=1,DHAN_ACCESS_TOKEN_SECRET_ID=dhan-access-token,DHAN_ROTATE_WHEN_HOURS_LEFT=6,LIVE_TRADING_ENABLED=0,SYSTEM3_LIVE_TRADING_ALLOWED=0,AUTO_EXECUTE_TRADES=0,ANALYZE_MODE=1" \
            --set-secrets="DHAN_CLIENT_ID=system3-dhan-client-id:latest,DHAN_ACCESS_TOKEN=dhan-access-token:latest,DHAN_PIN=dhan-pin:latest,DHAN_TOTP_SECRET=dhan-totp-secret:latest"

          gcloud run jobs add-iam-policy-binding "${DHAN_ROTATION_JOB}" \
            --project="${GOOGLE_CLOUD_PROJECT}" \
            --region="${GCP_REGION}" \
            --member="serviceAccount:${RUNTIME_SA}" \
            --role="roles/run.invoker" \
            --quiet >/dev/null

          SCHEDULER_URI="https://run.googleapis.com/v2/projects/${GOOGLE_CLOUD_PROJECT}/locations/${GCP_REGION}/jobs/${DHAN_ROTATION_JOB}:run"
          if gcloud scheduler jobs describe "${DHAN_ROTATION_SCHEDULER}" \
              --project="${GOOGLE_CLOUD_PROJECT}" --location="${GCP_REGION}" >/dev/null 2>&1; then
            gcloud scheduler jobs update http "${DHAN_ROTATION_SCHEDULER}" \
              --project="${GOOGLE_CLOUD_PROJECT}" \
              --location="${GCP_REGION}" \
              --schedule="30 7 * * *" \
              --time-zone="Asia/Kolkata" \
              --uri="${SCHEDULER_URI}" \
              --http-method=POST \
              --oauth-service-account-email="${RUNTIME_SA}" \
              --oauth-token-scope="https://www.googleapis.com/auth/cloud-platform" \
              --update-headers="Content-Type=application/json" \
              --message-body='{}'
          else
            gcloud scheduler jobs create http "${DHAN_ROTATION_SCHEDULER}" \
              --project="${GOOGLE_CLOUD_PROJECT}" \
              --location="${GCP_REGION}" \
              --schedule="30 7 * * *" \
              --time-zone="Asia/Kolkata" \
              --uri="${SCHEDULER_URI}" \
              --http-method=POST \
              --oauth-service-account-email="${RUNTIME_SA}" \
              --oauth-token-scope="https://www.googleapis.com/auth/cloud-platform" \
              --headers="Content-Type=application/json" \
              --message-body='{}'
          fi

      - name: Execute token rotator once and wait
        run: |
          gcloud run jobs execute "${DHAN_ROTATION_JOB}" \
            --project="${GOOGLE_CLOUD_PROJECT}" \
            --region="${GCP_REGION}" \
            --wait

      - name: Prove service and scheduler safety
        run: |
          gcloud run services describe "${GCP_CLOUD_RUN_SERVICE}" \
            --project="${GOOGLE_CLOUD_PROJECT}" \
            --region="${GCP_REGION}" \
            --format=json > /tmp/svc.json
          gcloud scheduler jobs describe "${DHAN_ROTATION_SCHEDULER}" \
            --project="${GOOGLE_CLOUD_PROJECT}" \
            --location="${GCP_REGION}" \
            --format=json > /tmp/scheduler.json
          python - <<'PY'
          import json, sys
          svc = json.load(open("/tmp/svc.json"))
          scheduler = json.load(open("/tmp/scheduler.json"))
          env = {}
          env_names = set()
          secret_env_names = set()
          for c in ((((svc.get("spec") or {}).get("template") or {}).get("spec") or {}).get("containers") or []):
              for e in c.get("env") or []:
                  if e.get("name"):
                      env_names.add(e["name"])
                  if e.get("name") and "value" in e:
                      env[e["name"]] = e["value"]
                  if e.get("name") and (e.get("valueFrom") or {}).get("secretKeyRef"):
                      secret_env_names.add(e["name"])
          bad = []
          for key in ("LIVE_TRADING_ENABLED", "SYSTEM3_LIVE_TRADING_ALLOWED", "AUTO_EXECUTE_TRADES"):
              if env.get(key) not in (None, "0", "false", "False"):
                  bad.append(f"{key}={env.get(key)!r}")
          if bad:
              print("LIVE_FLAGS_NOT_OFF", bad)
              sys.exit(2)
          if env.get("DHAN_TOKEN_SOURCE") != "gcp-secret-manager-dynamic":
              print("DYNAMIC_TOKEN_SOURCE_MISSING", env.get("DHAN_TOKEN_SOURCE"))
              sys.exit(3)
          if env.get("REQUIRE_API_KEY") not in ("true", "True"):
              print("DASHBOARD_API_LOCK_NOT_ENFORCED", env.get("REQUIRE_API_KEY"))
              sys.exit(4)
          if "API_KEY" not in secret_env_names:
              print("DASHBOARD_API_KEY_SECRET_NOT_MOUNTED")
              sys.exit(5)
          if "WORKER_PUSH_TOKEN" not in secret_env_names:
              print("WORKER_PUSH_TOKEN_SECRET_NOT_MOUNTED")
              sys.exit(5)
          if "API_KEY" in env:
              print("DASHBOARD_API_KEY_LEAKED_AS_PLAIN_VALUE")
              sys.exit(5)
          if "WORKER_PUSH_TOKEN" in env:
              print("WORKER_PUSH_TOKEN_LEAKED_AS_PLAIN_VALUE")
              sys.exit(5)
          if scheduler.get("schedule") != "30 7 * * *" or scheduler.get("timeZone") != "Asia/Kolkata":
              print("SCHEDULER_CONFIG_INVALID", scheduler.get("schedule"), scheduler.get("timeZone"))
              sys.exit(6)
          print("CLOUD_RUNTIME_SAFETY_OK", {
              "token_source": env.get("DHAN_TOKEN_SOURCE"),
              "dashboard_api_lock": "enforced",
              "dashboard_api_key_mounted_from_secret_manager": True,
              "worker_push_token_mounted_from_secret_manager": True,
              "live_trading": env.get("LIVE_TRADING_ENABLED"),
              "scheduler": scheduler.get("name"),
              "schedule": scheduler.get("schedule"),
              "time_zone": scheduler.get("timeZone"),
          })
          PY

      - name: Public UI broker proof
        run: |
          SERVICE_URL=$(gcloud run services describe "${GCP_CLOUD_RUN_SERVICE}" \
            --project="${GOOGLE_CLOUD_PROJECT}" \
            --region="${GCP_REGION}" \
            --format='value(status.url)')

          curl -fsS --max-time 30 \
            "${SERVICE_URL}/api/auth/status" > /tmp/auth.json
          jq '{required,configured,authenticated,mode}' /tmp/auth.json
          jq -e '.required == true and .configured == true and .authenticated == false and .mode == "session_cookie_or_header"' /tmp/auth.json >/dev/null

          # Verify anonymous session creation and protected mutation routes fail closed.
          # Only an intentionally-invalid probe key is used; the real secret is never read or logged.
          SESSION_STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            -X POST "${SERVICE_URL}/api/auth/session" \
            -H 'Content-Type: application/json' \
            -d '{"api_key":"deploy-ci-invalid-probe"}')
          echo "ANON_SESSION_WITH_INVALID_KEY_STATUS ${SESSION_STATUS}"
          [ "${SESSION_STATUS}" = "401" ] || { echo "Expected 401 for invalid dashboard API key probe, got ${SESSION_STATUS}"; exit 1; }

          for ATTEMPT in 1 2 3 4 5 6; do
              DASHBOARD_API_KEY=$(gcloud secrets versions access latest --secret="${API_KEY_SECRET_ID}" --project="${GOOGLE_CLOUD_PROJECT}")
            curl -fsS --max-time 30 \
                -H "X-API-Key: ${DASHBOARD_API_KEY}" \
              "${SERVICE_URL}/api/broker/status" > /tmp/broker.json || true
            if jq -e '.connected == true and .token_proof.source == "GCP_SECRET_MANAGER_DYNAMIC" and .live_trading_enabled == false and .order_placement_allowed == false' /tmp/broker.json >/dev/null 2>&1; then
              break
            fi
            sleep 10
          done

          jq '{connected,error,latency_ms,token_proof:{source:.token_proof.source,secret_id:.token_proof.secret_id,secret_version:.token_proof.secret_version,loaded_at_utc:.token_proof.loaded_at_utc,expires_at_utc:.token_proof.expires_at_utc,hours_remaining:.token_proof.hours_remaining,last_reload_reason:.token_proof.last_reload_reason,rotation_job:.token_proof.rotation_job,raw_token_exposed:.token_proof.token_value_exposed},token_reload,live_trading_enabled,order_placement_allowed}' /tmp/broker.json
          jq -e '.connected == true and .token_proof.source == "GCP_SECRET_MANAGER_DYNAMIC" and .token_proof.token_value_exposed == false and .live_trading_enabled == false and .order_placement_allowed == false' /tmp/broker.json >/dev/null

      - name: Re-authenticate as read-only evidence identity
        if: ${{ always() && vars.GCP_WIF_PROVIDER != '' && vars.GCP_EVIDENCE_SERVICE_ACCOUNT != '' }}
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GOOGLE_CLOUD_PROJECT }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_EVIDENCE_SERVICE_ACCOUNT }}

      - name: Generate sanitized GCP runtime evidence
        if: always()
        run: python scripts/gcp_runtime_evidence.py

      - name: Upload GCP runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system3-gcp-runtime-evidence-${{ github.run_number }}
          path: reports/latest/gcp_runtime_lock/
          if-no-files-found: error
          retention-days: 7

      - name: Enforce deployment provenance and safety lock
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("reports/latest/gcp_runtime_lock/gcp_runtime_lock.json")
          if not path.is_file():
              raise SystemExit("GCP_RUNTIME_EVIDENCE_MISSING")
          report = json.loads(path.read_text(encoding="utf-8"))
          safety = report.get("safety") or {}
          failures = []
          if not report.get("source_matches_deployment"):
              failures.append("source_matches_deployment=false")
          if not safety.get("analyze_mode"):
              failures.append("analyze_mode=false")
          for key in (
              "live_trading_enabled",
              "system3_live_trading_allowed",
              "auto_execute_trades",
              "secret_payloads_exposed",
          ):
              if safety.get(key):
                  failures.append(f"{key}=true")
          # Dashboard auth must be REQUIRED and CONFIGURED, not disabled: the
          # inverse of the legacy analyzer-phase invariant this report predates.
          for key in ("api_key_required", "api_key_mounted"):
              if not safety.get(key):
                  failures.append(f"{key}=false")
          if report.get("secret_values_exposed"):
              failures.append("secret_values_exposed=true")
          print("GCP_RUNTIME_LOCK", {
              "lock_result": report.get("lock_result"),
              "source_matches_deployment": report.get("source_matches_deployment"),
              "operational_blockers": report.get("blockers"),
              "production_grade_claim_allowed": report.get("production_grade_claim_allowed"),
          })
          if failures:
              raise SystemExit(f"GCP_RUNTIME_SAFETY_OR_PROVENANCE_FAIL {failures}")
          PY

      - name: Post deployment report
        if: always()
        run: |
          gcloud run services describe "${GCP_CLOUD_RUN_SERVICE}" \
            --project="${GOOGLE_CLOUD_PROJECT}" \
            --region="${GCP_REGION}" \
            --format='table(metadata.name,status.latestReadyRevisionName,status.url)' || true
          gcloud scheduler jobs describe "${DHAN_ROTATION_SCHEDULER}" \
            --project="${GOOGLE_CLOUD_PROJECT}" \
            --location="${GCP_REGION}" \
            --format='table(name,schedule,timeZone,state)' || true
