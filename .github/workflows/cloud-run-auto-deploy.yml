name: Cloud Run Auto Deploy

# GitHub is the code source; Google Cloud is the runtime and scheduler.
# PAPER/ANALYZER dashboard reads are public. LIVE remains locked OFF and
# unauthenticated mutation requests remain fail-closed in backend policy.
on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "core/**"
      - "scripts/start_cloud_run.py"
      - "scripts/gcp_dhan_token_rotation_job.py"
      - "scripts/gcp_cloud_run_auto_deploy.py"
      - "scripts/gcp_runtime_iam_preflight.py"
      - "scripts/gcp_failed_revision_forensic.py"
      - "scripts/gcp_runtime_evidence.py"
      - "scripts/gcp_public_dashboard_runtime_proof.py"
      - "scripts/gcp_mutation_policy_runtime_proof.py"
      - "scripts/gcp_runtime_identity_safety.py"
      - "scripts/sync_dhan_instruments_master.py"
      - "src/**"
      - "config/**"
      - "deploy/gcp/**"
      - ".github/workflows/cloud-run-auto-deploy.yml"
      - ".github/workflows/gcp-dhan-token-rotation.yml"
  workflow_dispatch:

concurrency:
  group: cloud-run-auto-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  statuses: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GOOGLE_CLOUD_PROJECT: system3-openalgo-safe
      GCP_REGION: asia-south1
      GCP_CLOUD_RUN_SERVICE: genesis-system3-web
      GCP_WEB_RUNTIME_SERVICE_ACCOUNT: genesis-system3-web@system3-openalgo-safe.iam.gserviceaccount.com
      DHAN_ROTATOR_SERVICE_ACCOUNT: genesis-system3-dhan-rotator@system3-openalgo-safe.iam.gserviceaccount.com
      DHAN_SCHEDULER_SERVICE_ACCOUNT: gs3-scheduler@system3-openalgo-safe.iam.gserviceaccount.com
      DHAN_ROTATION_JOB: genesis-system3-dhan-token-rotate
      DHAN_ROTATION_SCHEDULER: genesis-system3-dhan-token-rotate-daily
      GCP_WIF_PROVIDER: projects/802404398783/locations/global/workloadIdentityPools/github-genesis-system3/providers/github
      GCP_DEPLOY_SERVICE_ACCOUNT: genesis-system3-automation@system3-openalgo-safe.iam.gserviceaccount.com
      CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
      WORKER_PUSH_TOKEN_SECRET_ID: ${{ vars.WORKER_PUSH_TOKEN_SECRET_ID || 'system3-dashboard-worker-push-token' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud with keyless WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GOOGLE_CLOUD_PROJECT }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Static safety and syntax gates
        run: |
          python -m compileall -q core dashboard scripts
          python -m unittest -q tests.test_gcp_runtime_identity_safety
          python - <<'PY'
          from pathlib import Path
          required = {
              "core/brokers/dhan/cloud_token_provider.py": "GCP_SECRET_MANAGER_DYNAMIC",
              "core/brokers/dhan/cloud_runtime_patch.py": "order_placement_allowed",
              "scripts/gcp_dhan_token_rotation_job.py": "order_endpoints_called",
              "scripts/gcp_runtime_iam_preflight.py": "FIRESTORE_RUNTIME_IAM_OK",
              "scripts/gcp_failed_revision_forensic.py": "FAILED_REVISION_FORENSIC",
              "scripts/gcp_runtime_evidence.py": "dashboard_public_readonly",
              "scripts/gcp_cloud_run_auto_deploy.py": "DASHBOARD_PUBLIC_READONLY",
              "scripts/gcp_public_dashboard_runtime_proof.py": "PUBLIC_DASHBOARD_RUNTIME_PROOF",
              "scripts/gcp_mutation_policy_runtime_proof.py": "MUTATION_POLICY_RUNTIME_PROOF",
              "scripts/gcp_runtime_identity_safety.py": "CLOUD_RUNTIME_SAFETY_OK",
              "dashboard/frontend/src/App.tsx": "public/read-only",
              "dashboard/backend/security_policy.py": "PUBLIC_DASHBOARD_READ_ONLY",
              "dashboard/backend/mutation_policy.py": "LIVE_MUTATION_LOCKED",
              "dashboard/backend/secure_app.py": "control_authorized=False",
          }
          for path, marker in required.items():
              text = Path(path).read_text(encoding="utf-8")
              assert marker in text, f"missing marker {marker} in {path}"
          assert 'LIVE_TRADING_ENABLED"] = "0"' in Path("scripts/gcp_dhan_token_rotation_job.py").read_text()

          workflow = Path(".github/workflows/cloud-run-auto-deploy.yml").read_text(encoding="utf-8")
          legacy_sa_key_name = "GCP_" + "SA_KEY"
          legacy_credentials_field = "credentials_" + "json"
          legacy_auth_hits = [
              line.strip()
              for line in workflow.splitlines()
              if not line.lstrip().startswith("#")
              and (legacy_sa_key_name in line or legacy_credentials_field in line)
          ]
          assert not legacy_auth_hits, f"legacy service-account-key auth found: {legacy_auth_hits}"
          assert "DHAN_ROTATOR_SERVICE_ACCOUNT" in workflow
          assert "DHAN_SCHEDULER_SERVICE_ACCOUNT" in workflow
          assert '--service-account="${DHAN_ROTATOR_SERVICE_ACCOUNT}"' in workflow
          assert '--oauth-service-account-email="${DHAN_SCHEDULER_SERVICE_ACCOUNT}"' in workflow

          # Construct forbidden Secret Manager role fragments so the guard does
          # not match its own source. Scan executable/non-comment lines only;
          # any real role grant remains a hard failure.
          secret_accessor_marker = "secret" + "Accessor"
          secret_version_adder_marker = "secretVersion" + "Adder"
          secret_role_hits = [
              line.strip()
              for line in workflow.splitlines()
              if line.strip()
              and not line.lstrip().startswith("#")
              and (secret_accessor_marker in line or secret_version_adder_marker in line)
          ]
          assert not secret_role_hits, f"Secret Manager privilege grant found in deploy workflow: {secret_role_hits}"

          executable_service_updates = [
              line.strip()
              for line in workflow.splitlines()
              if line.strip().startswith("gcloud run services update ")
          ]
          assert not executable_service_updates, (
              "workflow must delegate Cloud Run service mutation to canonical deployer: "
              f"{executable_service_updates}"
          )

          deployer = Path("scripts/gcp_cloud_run_auto_deploy.py").read_text(encoding="utf-8")
          assert '("REQUIRE_API_KEY", "false")' in deployer
          assert '("SYSTEM3_STATE_BACKEND", "firestore")' in deployer
          assert '("SYSTEM3_STATE_BACKEND_REQUIRED", "1")' in deployer
          assert "--remove-secrets=API_KEY" in deployer
          assert "WORKER_PUSH_TOKEN_SECRET_ID" in deployer
          print("STATIC_GATES_OK", sorted(required))
          PY

      - name: Verify worker Secret Manager secret exists
        run: |
          gcloud secrets describe "${WORKER_PUSH_TOKEN_SECRET_ID}" \
            --project="${GOOGLE_CLOUD_PROJECT}" >/dev/null \
            || { echo "Required worker secret '${WORKER_PUSH_TOKEN_SECRET_ID}' does not exist." >&2; exit 1; }

      - name: Ensure required Firestore IAM for web runtime
        run: python scripts/gcp_runtime_iam_preflight.py

      - name: Build frontend proof
        working-directory: dashboard/frontend
        run: |
          npm ci --legacy-peer-deps
          npm run build
          grep -R -q "SYSTEM3" dist/assets

      - name: Install deploy dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "google-auth>=2.28.0" "requests>=2.31.0"

      - name: Verify required Google Cloud APIs are available
        run: |
          gcloud run services describe "${GCP_CLOUD_RUN_SERVICE}" \
            --project="${GOOGLE_CLOUD_PROJECT}" \
            --region="${GCP_REGION}" \
            --format='value(metadata.name,status.url)' >/tmp/preflight-service.txt
          test -s /tmp/preflight-service.txt
          gcloud iam service-accounts describe "${DHAN_ROTATOR_SERVICE_ACCOUNT}" \
            --project="${GOOGLE_CLOUD_PROJECT}" --format='value(email)' >/tmp/rotator-sa.txt
          gcloud iam service-accounts describe "${DHAN_SCHEDULER_SERVICE_ACCOUNT}" \
            --project="${GOOGLE_CLOUD_PROJECT}" --format='value(email)' >/tmp/scheduler-sa.txt
          grep -Fxq "${DHAN_ROTATOR_SERVICE_ACCOUNT}" /tmp/rotator-sa.txt
          grep -Fxq "${DHAN_SCHEDULER_SERVICE_ACCOUNT}" /tmp/scheduler-sa.txt

      - name: Deploy guarded public PAPER Cloud Run service
        run: python scripts/gcp_cloud_run_auto_deploy.py

      - name: Prove and capture public PAPER dashboard without API key
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/gcp_public_dashboard_runtime_proof.py

      - name: Upload public dashboard visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-paper-dashboard-proof-${{ github.run_number }}
          path: reports/latest/public_dashboard_proof/
          if-no-files-found: warn
          retention-days: 14

      - name: Prove runtime mutation capability matrix
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/gcp_mutation_policy_runtime_proof.py

      - name: Upload mutation policy runtime proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-policy-runtime-proof-${{ github.run_number }}
          path: reports/latest/mutation_policy_runtime_proof/
          if-no-files-found: warn
          retention-days: 14

      - name: Configure isolated Dhan rotator and Cloud Scheduler
        run: |
          RUNTIME_SA=$(gcloud run services describe "${GCP_CLOUD_RUN_SERVICE}" \
            --project="${GOOGLE_CLOUD_PROJECT}" \
            --region="${GCP_REGION}" \
            --format='value(spec.template.spec.serviceAccountName)')
          test "${RUNTIME_SA}" = "${GCP_WEB_RUNTIME_SERVICE_ACCOUNT}"
          echo "RUNTIME_SERVICE_ACCOUNT=${RUNTIME_SA}" >> "$GITHUB_ENV"

          IMAGE=$(gcloud run services describe "${GCP_CLOUD_RUN_SERVICE}" \
            --project="${GOOGLE_CLOUD_PROJECT}" \
            --region="${GCP_REGION}" \
            --format='value(spec.template.spec.containers[0].image)')

          gcloud run jobs deploy "${DHAN_ROTATION_JOB}" \
            --project="${GOOGLE_CLOUD_PROJECT}" \
            --region="${GCP_REGION}" \
            --image="${IMAGE}" \
            --service-account="${DHAN_ROTATOR_SERVICE_ACCOUNT}" \
            --command=python \
            --args=scripts/gcp_dhan_token_rotation_job.py \
            --tasks=1 \
            --parallelism=1 \
            --max-retries=0 \
            --task-timeout=10m \
            --set-env-vars="GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT},CLOUD_MODE=1,DHAN_PERSIST_TOKEN_TO_SM=1,DHAN_ACCESS_TOKEN_SECRET_ID=dhan-access-token,DHAN_ROTATE_WHEN_HOURS_LEFT=6,LIVE_TRADING_ENABLED=0,SYSTEM3_LIVE_TRADING_ALLOWED=0,AUTO_EXECUTE_TRADES=0,ANALYZE_MODE=1" \
            --set-secrets="DHAN_CLIENT_ID=system3-dhan-client-id:latest,DHAN_ACCESS_TOKEN=dhan-access-token:latest,DHAN_PIN=dhan-pin:latest,DHAN_TOTP_SECRET=dhan-totp-secret:latest"

          # The web runtime may request canonical self-heal; Scheduler may invoke
          # the same job. Neither identity can read PIN/TOTP or mint tokens.
          for INVOKER in "${GCP_WEB_RUNTIME_SERVICE_ACCOUNT}" "${DHAN_SCHEDULER_SERVICE_ACCOUNT}"; do
            gcloud run jobs add-iam-policy-binding "${DHAN_ROTATION_JOB}" \
              --project="${GOOGLE_CLOUD_PROJECT}" --region="${GCP_REGION}" \
              --member="serviceAccount:${INVOKER}" --role="roles/run.invoker" \
              --quiet >/dev/null
          done

          SCHEDULER_URI="https://run.googleapis.com/v2/projects/${GOOGLE_CLOUD_PROJECT}/locations/${GCP_REGION}/jobs/${DHAN_ROTATION_JOB}:run"
          if gcloud scheduler jobs describe "${DHAN_ROTATION_SCHEDULER}" \
              --project="${GOOGLE_CLOUD_PROJECT}" --location="${GCP_REGION}" >/dev/null 2>&1; then
            gcloud scheduler jobs update http "${DHAN_ROTATION_SCHEDULER}" \
              --project="${GOOGLE_CLOUD_PROJECT}" \
              --location="${GCP_REGION}" \
              --schedule="30 7 * * *" \
              --time-zone="Asia/Kolkata" \
              --uri="${SCHEDULER_URI}" \
              --http-method=POST \
              --oauth-service-account-email="${DHAN_SCHEDULER_SERVICE_ACCOUNT}" \
              --oauth-token-scope="https://www.googleapis.com/auth/cloud-platform" \
              --update-headers="Content-Type=application/json" \
              --message-body='{}'
          else
            gcloud scheduler jobs create http "${DHAN_ROTATION_SCHEDULER}" \
              --project="${GOOGLE_CLOUD_PROJECT}" \
              --location="${GCP_REGION}" \
              --schedule="30 7 * * *" \
              --time-zone="Asia/Kolkata" \
              --uri="${SCHEDULER_URI}" \
              --http-method=POST \
              --oauth-service-account-email="${DHAN_SCHEDULER_SERVICE_ACCOUNT}" \
              --oauth-token-scope="https://www.googleapis.com/auth/cloud-platform" \
              --headers="Content-Type=application/json" \
              --message-body='{}'
          fi

      - name: Execute token rotator once and wait
        run: |
          gcloud run jobs execute "${DHAN_ROTATION_JOB}" \
            --project="${GOOGLE_CLOUD_PROJECT}" \
            --region="${GCP_REGION}" \
            --wait

      - name: Prove service, rotator identity and scheduler safety
        run: |
          gcloud run services describe "${GCP_CLOUD_RUN_SERVICE}" \
            --project="${GOOGLE_CLOUD_PROJECT}" \
            --region="${GCP_REGION}" \
            --format=json > /tmp/svc.json
          gcloud run jobs describe "${DHAN_ROTATION_JOB}" \
            --project="${GOOGLE_CLOUD_PROJECT}" \
            --region="${GCP_REGION}" \
            --format=json > /tmp/rotator.json
          gcloud scheduler jobs describe "${DHAN_ROTATION_SCHEDULER}" \
            --project="${GOOGLE_CLOUD_PROJECT}" \
            --location="${GCP_REGION}" \
            --format=json > /tmp/scheduler.json
          python scripts/gcp_runtime_identity_safety.py

      - name: Public dashboard and broker proof without API key
        run: |
          SERVICE_URL=$(gcloud run services describe "${GCP_CLOUD_RUN_SERVICE}" --project="${GOOGLE_CLOUD_PROJECT}" --region="${GCP_REGION}" --format='value(status.url)')
          curl -fsS --max-time 30 "${SERVICE_URL}/api/auth/status" > /tmp/auth.json
          jq -e '.required == false and .configured == false and .authenticated == false and .mode == "public_readonly" and .credential_surface == "REMOVED" and .session == null' /tmp/auth.json >/dev/null
          curl -fsS --max-time 30 "${SERVICE_URL}/api/state" > /tmp/state.json
          for ATTEMPT in 1 2 3 4 5 6; do
            curl -fsS --max-time 30 "${SERVICE_URL}/api/broker/status" > /tmp/broker.json || true
            if jq -e '.connected == true and .token_proof.source == "GCP_SECRET_MANAGER_DYNAMIC" and .live_trading_enabled == false and .order_placement_allowed == false' /tmp/broker.json >/dev/null 2>&1; then break; fi
            sleep 10
          done
          jq -e '.connected == true and .token_proof.source == "GCP_SECRET_MANAGER_DYNAMIC" and .token_proof.token_value_exposed == false and .live_trading_enabled == false and .order_placement_allowed == false' /tmp/broker.json >/dev/null

      - name: Generate sanitized GCP runtime evidence
        if: always()
        run: python scripts/gcp_runtime_evidence.py

      - name: Upload GCP runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system3-gcp-runtime-evidence-${{ github.run_number }}
          path: reports/latest/gcp_runtime_lock/
          if-no-files-found: error
          retention-days: 7

      - name: Enforce deployment provenance and public-dashboard safety lock
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path("reports/latest/gcp_runtime_lock/gcp_runtime_lock.json")
          if not path.is_file(): raise SystemExit("GCP_RUNTIME_EVIDENCE_MISSING")
          report=json.loads(path.read_text(encoding="utf-8")); safety=report.get("safety") or {}; failures=[]
          if not report.get("source_matches_deployment"): failures.append("source_matches_deployment=false")
          if not safety.get("analyze_mode"): failures.append("analyze_mode=false")
          if not safety.get("dashboard_public_readonly"): failures.append("dashboard_public_readonly=false")
          for key in ("live_trading_enabled","system3_live_trading_allowed","auto_execute_trades","secret_payloads_exposed","api_key_required","api_key_mounted","api_key_plaintext_exposed"):
              if safety.get(key): failures.append(f"{key}=true")
          if report.get("secret_values_exposed"): failures.append("secret_values_exposed=true")
          print("GCP_RUNTIME_LOCK", {"lock_result":report.get("lock_result"),"source_matches_deployment":report.get("source_matches_deployment"),"operational_blockers":report.get("blockers")})
          if failures: raise SystemExit(f"GCP_RUNTIME_SAFETY_OR_PROVENANCE_FAIL {failures}")
          PY

      - name: Post deployment report
        if: always()
        run: |
          gcloud run services describe "${GCP_CLOUD_RUN_SERVICE}" --project="${GOOGLE_CLOUD_PROJECT}" --region="${GCP_REGION}" --format='table(status.traffic.revisionName,status.traffic.percent,status.url)' || true
          gcloud run jobs describe "${DHAN_ROTATION_JOB}" --project="${GOOGLE_CLOUD_PROJECT}" --region="${GCP_REGION}" --format='table(metadata.name,spec.template.spec.template.spec.serviceAccountName)' || true
          gcloud scheduler jobs describe "${DHAN_ROTATION_SCHEDULER}" --project="${GOOGLE_CLOUD_PROJECT}" --location="${GCP_REGION}" --format='table(name,schedule,timeZone,state,httpTarget.oauthToken.serviceAccountEmail)' || true

      - name: Publish exact-SHA runtime proof success
        if: ${{ success() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          sha=os.environ["GITHUB_SHA"]; repo=os.environ["GITHUB_REPOSITORY"]; api=os.environ["GITHUB_API_URL"]
          body=json.dumps({"state":"success","context":"cloud-run/runtime-proof","description":"Cloud Run PAPER public/read-only runtime proof passed","target_url":f'{os.environ["GITHUB_SERVER_URL"]}/{repo}/actions/runs/{os.environ["GITHUB_RUN_ID"]}'}).encode()
          req=urllib.request.Request(f"{api}/repos/{repo}/statuses/{sha}",data=body,headers={"Authorization":f"Bearer {os.environ['GITHUB_TOKEN']}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"},method="POST")
          with urllib.request.urlopen(req,timeout=30) as r: assert r.status in (200,201)
          PY

      - name: Publish exact-SHA runtime proof failure
        if: ${{ failure() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          sha=os.environ["GITHUB_SHA"]; repo=os.environ["GITHUB_REPOSITORY"]; api=os.environ["GITHUB_API_URL"]
          body=json.dumps({"state":"failure","context":"cloud-run/runtime-proof","description":"Cloud Run deployment or PAPER runtime proof failed","target_url":f'{os.environ["GITHUB_SERVER_URL"]}/{repo}/actions/runs/{os.environ["GITHUB_RUN_ID"]}'}).encode()
          req=urllib.request.Request(f"{api}/repos/{repo}/statuses/{sha}",data=body,headers={"Authorization":f"Bearer {os.environ['GITHUB_TOKEN']}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"},method="POST")
          with urllib.request.urlopen(req,timeout=30) as r: assert r.status in (200,201)
          PY
