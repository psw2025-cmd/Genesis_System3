name: Genesis System3 Global Safety CI

# GitHub-hosted cloud CI only.
# Analyzer/Paper only. No live trading. No repo write-back from CI.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: global-safety-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SYSTEM3_MODE: analyze
  ANALYZE_MODE: "1"
  LIVE_TRADING_ENABLED: "0"
  SYSTEM3_LIVE_TRADING_ALLOWED: "0"
  AUTO_EXECUTE_TRADES: "0"
  SYSTEM3_REAL_ONLY: "1"
  DEFER_INSTRUMENT_WARMUP: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  workflow-policy-guard:
    name: BLOCKING - workflow policy and trading safety guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          clean: true

      - name: Verify workflow policy and trading safety
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Legacy workflows remain quarantined; every new or modified workflow must satisfy this policy.
          echo "Scanning new or changed workflow files..."
          workflows=()
          if [[ -n "${BASE_SHA:-}" && ! "$BASE_SHA" =~ ^0+$ ]] && ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi

          if [[ -n "${BASE_SHA:-}" && ! "$BASE_SHA" =~ ^0+$ ]] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            mapfile -t workflows < <(
              git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" -- \
                '.github/workflows/*.yml' '.github/workflows/*.yaml' | sort
            )
          else
            echo "No usable base SHA; validating the authoritative CI workflow."
            workflows=(.github/workflows/ci.yml)
          fi

          if [[ ${#workflows[@]} -eq 0 ]]; then
            echo "No workflow files changed; baseline policy check has nothing new to scan."
            workflows=(.github/workflows/ci.yml)
          fi

          for workflow in "${workflows[@]}"; do
            test -f "$workflow" || { echo "FAIL: workflow missing: $workflow"; exit 1; }
          done

          printf 'Workflow files under policy review:\n'
          printf '  %s\n' "${workflows[@]}"

          test -f .github/workflows/ci.yml || { echo "FAIL: ci.yml missing"; exit 1; }

          echo "Checking CI permissions are read-only..."
          if grep -nE "contents:[[:space:]]*write|actions:[[:space:]]*write|packages:[[:space:]]*write|pull-requests:[[:space:]]*write|issues:[[:space:]]*write" "${workflows[@]}"; then
            echo "FAIL: write permission found in workflow. CI must remain read-only."
            exit 1
          fi

          echo "Checking CI uses GitHub-hosted cloud runners only..."
          if grep -nE "runs-on:[[:space:]]*self-hosted|runs-on:[[:space:]]*\[[^]]*self-hosted" .github/workflows/ci.yml; then
            echo "FAIL: self-hosted runner found. Global safety CI must not execute on a laptop/local runner."
            exit 1
          fi
          expected_hosted_jobs=5
          actual_hosted_jobs=$(grep -cE "runs-on:[[:space:]]*ubuntu-latest" .github/workflows/ci.yml)
          test "$actual_hosted_jobs" -eq "$expected_hosted_jobs" || {
            echo "FAIL: expected ${expected_hosted_jobs} ubuntu-latest jobs, found ${actual_hosted_jobs}"
            exit 1
          }

          echo "Checking forbidden auto-write/deploy commands..."
          if grep -nE "git[[:space:]]+p[u]sh|gh[[:space:]]+pr[[:space:]]+m[e]rge|gh[[:space:]]+r[e]lease|create-pull-r[e]quest|peter-evans/create-pull-r[e]quest|--auto-f[i]x|auto_f[i]x|autof[i]x" "${workflows[@]}"; then
            echo "FAIL: auto-fix/write-back behavior found in workflow."
            exit 1
          fi

          if grep -nE "azure/webapps-d[e]ploy|aws-a[c]tions|google-github-actions/d[e]ploy|render d[e]ploy|flyctl d[e]ploy|railway [u]p|vercel --p[r]od|netlify d[e]ploy" "${workflows[@]}"; then
            echo "FAIL: cloud deploy command/action found in workflow."
            exit 1
          fi

          echo "Checking live trading is hard-disabled..."
          if grep -nE "LIVE_TRADING_ENABLED:[[:space:]]*[\"']?(1|true|TRUE|yes|YES)[\"']?|SYSTEM3_LIVE_TRADING_ALLOWED:[[:space:]]*[\"']?(1|true|TRUE|yes|YES)[\"']?" "${workflows[@]}"; then
            echo "FAIL: live trading enabled inside workflow."
            exit 1
          fi

          grep -q 'LIVE_TRADING_ENABLED: "0"' .github/workflows/ci.yml || { echo "FAIL: LIVE_TRADING_ENABLED=0 missing from ci.yml"; exit 1; }
          grep -q 'SYSTEM3_LIVE_TRADING_ALLOWED: "0"' .github/workflows/ci.yml || { echo "FAIL: SYSTEM3_LIVE_TRADING_ALLOWED=0 missing from ci.yml"; exit 1; }
          grep -q 'AUTO_EXECUTE_TRADES: "0"' .github/workflows/ci.yml || { echo "FAIL: AUTO_EXECUTE_TRADES=0 missing from ci.yml"; exit 1; }

          echo "policy_guard=PASS"
          echo "cloud_runner_policy=PASS"
          echo "trading_safety=PASS"

  architecture-trading-safety:
    name: BLOCKING - architecture and trading safety gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: workflow-policy-guard
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run root architecture gate
        shell: bash
        run: |
          set -euo pipefail
          python --version
          test -f .github/scripts/root_architecture_gate.py
          python .github/scripts/root_architecture_gate.py
          echo "architecture_gate=PASS"

  python-compile-proof:
    name: BLOCKING - Python compile proof
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: workflow-policy-guard
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Compile critical scripts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile system3_control_plane.py
          python -m py_compile scripts/system3_full_repo_verification.py
          python -m py_compile scripts/system3_master_proof_orchestrator.py
          python -m py_compile scripts/system3_proof_pack_closure_gate.py
          python -m py_compile scripts/quant_alpha_evaluator.py
          python -m py_compile src/quant/alpha_truth.py
          echo "compile_proof=PASS"

  full-proof-pack-validation:
    name: BLOCKING - full proof pack validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: workflow-policy-guard
    env:
      SYSTEM3_MODE: analyze
      ANALYZE_MODE: "1"
      LIVE_TRADING_ENABLED: "0"
      SYSTEM3_LIVE_TRADING_ALLOWED: "0"
      AUTO_EXECUTE_TRADES: "0"
      SYSTEM3_REAL_ONLY: "1"
      DEFER_INSTRUMENT_WARMUP: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          clean: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CI and backend dependencies
        shell: bash
        run: |
          set -euo pipefail
          python --version
          python -m pip install --upgrade pip --quiet
          test -f requirements-ci.txt
          test -f dashboard/backend/requirements.txt
          test -f dashboard/backend/app.py
          python -m pip install --no-cache-dir -r requirements-ci.txt --quiet
          python -m pip install --no-cache-dir -r dashboard/backend/requirements.txt --quiet
          echo "deps_install=PASS"

      - name: Compile expanded critical scripts
        shell: bash
        run: |
          set -euo pipefail
          test -f dashboard/backend/app.py || { echo "FATAL: dashboard/backend/app.py missing after checkout"; ls -la dashboard/backend | head -50; exit 1; }
          python -m py_compile system3_control_plane.py
          python -m py_compile system3_ultra.py
          python -m py_compile run_system3.py
          python -m py_compile .github/scripts/root_architecture_gate.py
          python -m py_compile scripts/system3_full_repo_verification.py
          python -m py_compile scripts/system3_master_proof_orchestrator.py
          python -m py_compile scripts/system3_issue_24_26_27_28_proof_batch.py
          python -m py_compile scripts/system3_proof_pack_closure_gate.py
          python -m py_compile dashboard/backend/app.py
          python -m py_compile scripts/paper_day_proof_pack.py
          python -m py_compile scripts/run_dashboard_browser_proof.py
          python -m py_compile scripts/daily_prediction_benchmark.py
          python -m py_compile scripts/repo_authority_audit.py
          python -m py_compile core/utils/nse_holidays.py
          python -m py_compile scripts/cloud_worker.py
          python -m py_compile core/engine/system3_phase82_job_scheduler.py
          python -m py_compile scripts/system3_self_healing_watchdog.py
          python -m py_compile scripts/quant_alpha_evaluator.py
          python -m py_compile src/quant/alpha_truth.py
          test -f dashboard/frontend/src/components/LiveTradingGate.tsx
          python -c "import json; json.load(open('config/system3_job_scheduler.json'))" && echo "scheduler_config_json=VALID"
          python -c "import json; json.load(open('config/quant_alpha_targets.json'))" && echo "quant_alpha_targets_json=VALID"
          echo "compile_expanded=PASS"

      - name: Dashboard backend import smoke
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          os.environ["SYSTEM3_MODE"] = "analyze"
          os.environ["ANALYZE_MODE"] = "1"
          os.environ["LIVE_TRADING_ENABLED"] = "0"
          os.environ["SYSTEM3_LIVE_TRADING_ALLOWED"] = "0"
          os.environ["AUTO_EXECUTE_TRADES"] = "0"
          os.environ["SYSTEM3_REAL_ONLY"] = "1"
          os.environ["DEFER_INSTRUMENT_WARMUP"] = "1"
          import dashboard.backend.app as app
          assert getattr(app, "app", None) is not None, "FastAPI app object missing"
          assert os.environ["LIVE_TRADING_ENABLED"] == "0", "LIVE_TRADING_ENABLED safety check failed"
          assert os.environ["SYSTEM3_LIVE_TRADING_ALLOWED"] == "0", "SYSTEM3_LIVE_TRADING_ALLOWED safety check failed"
          assert os.environ["AUTO_EXECUTE_TRADES"] == "0", "AUTO_EXECUTE_TRADES safety check failed"
          print("dashboard_backend_import_smoke=PASS")
          print("live_trading_safety_in_app=PASS")
          PY

      - name: Dashboard backend pytest suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest \
            tests/test_dashboard_app.py \
            tests/test_qc_validator_dhan_aliases.py \
            tests/test_qc_runtime_anomaly.py \
            tests/test_scheduler_catchup.py \
            tests/test_quant_alpha_truth.py \
            tests/test_dhan_market_ltp.py \
            -v --tb=short

      - name: Classify quantitative AlphaTruth evidence
        shell: bash
        run: |
          set -euo pipefail
          python scripts/quant_alpha_evaluator.py
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("reports/latest/quant_alpha_evaluator/evaluation.json")
          report = json.loads(path.read_text(encoding="utf-8"))
          assert report["live_trading_enabled"] is False
          assert report["real_orders_attempted"] == 0
          assert report["model_auto_promotion_allowed"] is False
          assert report["destructive_git_reset_allowed"] is False
          assert report["retry_budget"] == 5
          assert report["state"] in {
              "PROVEN", "TARGET_FAIL", "INSUFFICIENT_EVIDENCE", "LEAKAGE_BLOCKED", "SCHEMA_ERROR", "DATA_ERROR"
          }
          if report["state"] == "PROVEN":
              assert report["research_candidate_allowed"] is True
              assert not report.get("blockers")
          else:
              assert report["research_candidate_allowed"] is False
          print("ALPHATRUTH_CI_CONTRACT_OK", report["state"])
          PY

      - name: Run proof batch
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/system3_issue_24_26_27_28_proof_batch.py
          python scripts/system3_issue_24_26_27_28_proof_batch.py
          test -d reports/latest/implementation_batch
          test -f reports/latest/implementation_batch/status_matrix.json
          test -f reports/latest/implementation_batch/unresolved_blockers.md
          echo "proof_batch=PASS"

      - name: Run proof pack closure gate
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/system3_proof_pack_closure_gate.py
          python scripts/system3_proof_pack_closure_gate.py
          test -f reports/latest/proof_pack_closure_gate/summary.json
          echo "proof_pack_closure_gate=PASS"

      - name: Upload proof pack artifact
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: system3-proof-pack-${{ github.run_number }}
          path: reports/latest/
          if-no-files-found: warn
          retention-days: 30

  frontend-build:
    name: BLOCKING - frontend production build + browser runtime
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: workflow-policy-guard
    defaults:
      run:
        working-directory: dashboard/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node 20 for reproducible frontend CI
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        shell: bash
        run: npm ci --no-audit --no-fund

      - name: Build (vite build)
        shell: bash
        run: npm run build

      - name: Compile browser runtime smoke
        shell: bash
        run: python -m py_compile ../../scripts/frontend_local_runtime_smoke.py

      - name: Prove all 22 canonical tabs render in Chrome
        shell: bash
        run: |
          set -euo pipefail
          rc=1
          for attempt in 1 2; do
            set +e
            timeout 180s python ../../scripts/frontend_local_runtime_smoke.py
            rc=$?
            set -e
            if [[ "$rc" -eq 0 ]]; then
              echo "frontend_browser_smoke_attempt_${attempt}=PASS"
              exit 0
            fi
            echo "frontend_browser_smoke_attempt_${attempt}=FAIL rc=${rc}"
            if [[ "$attempt" -eq 1 ]]; then
              sleep 3
            fi
          done
          exit "$rc"