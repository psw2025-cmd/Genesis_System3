name: system3-runbook-audit

on:
  # GCP-EXIT NOTE (2026-09-01): automatic push trigger removed — this audit
  # calls live GCP; a normal main push must not invoke GCP. Manual only now.
  # See Issue #188 / A-GCP-KILL.
  workflow_dispatch:

jobs:
  run-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/802404398783/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider'
          service_account: 'genesis-system3-web@system3-openalgo-safe.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: system3-openalgo-safe

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Run Auditable Route Verification
        run: |
          python tools/verify_all_routes_auditable.py
