name: GCP Live UI Semantic Proof

on:
  workflow_run:
    workflows: ["Cloud Run Auto Deploy"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  statuses: write

concurrency:
  group: gcp-live-ui-semantic-proof
  cancel-in-progress: false

jobs:
  semantic-proof:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOOGLE_CLOUD_PROJECT: system3-openalgo-safe
      GCP_REGION: asia-south1
      GCP_CLOUD_RUN_SERVICE: genesis-system3-web
      GCP_WIF_PROVIDER: projects/802404398783/locations/global/workloadIdentityPools/github-genesis-system3/providers/github
      GCP_DEPLOY_SERVICE_ACCOUNT: genesis-system3-automation@system3-openalgo-safe.iam.gserviceaccount.com
      SYSTEM3_PRODUCTION_URL: https://genesis-system3-web-doq2wplepa-el.a.run.app
      GITHUB_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout exact deployed SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ env.GITHUB_SHA }}

      - name: Authenticate to Google Cloud with keyless WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GOOGLE_CLOUD_PROJECT }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install proof dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Prove exact-SHA live API and rendered UI semantics
        env:
          SYSTEM3_LIVE_UI_READY_WAIT_S: "240"
        run: python scripts/gcp_live_ui_semantic_proof.py

      - name: Upload semantic proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcp-live-ui-semantic-proof-${{ github.run_number }}
          path: reports/latest/live_ui_semantic_proof/
          if-no-files-found: warn
          retention-days: 14
