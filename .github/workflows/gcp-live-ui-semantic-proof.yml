name: GCP Live UI Semantic Proof

on:
  workflow_run:
    workflows: ["Cloud Run Auto Deploy"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: gcp-live-ui-semantic-proof
  cancel-in-progress: false

jobs:
  semantic-proof:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SYSTEM3_PRODUCTION_URL: https://genesis-system3-web-doq2wplepa-el.a.run.app
      GITHUB_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONPATH: .
    steps:
      - name: Checkout exact deployed SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ env.GITHUB_SHA }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install proof dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Prove exact-SHA live API and rendered UI semantics
        env:
          SYSTEM3_LIVE_UI_READY_WAIT_S: "240"
        run: python scripts/gcp_live_ui_semantic_proof.py

      - name: Prove full exact-SHA 22-tab visual semantics and four required chains
        if: always()
        env:
          SYSTEM3_LIVE_UI_READY_WAIT_S: "240"
          # Diagnostic/full-product proof must not overwrite the established
          # live-ui/semantic-proof commit-status context emitted by the canonical
          # proof above. The step result still gates this workflow and its artifact.
          GITHUB_TOKEN: ""
        run: python scripts/gcp_full_dashboard_acceptance.py

      - name: Upload semantic and visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcp-live-ui-semantic-proof-${{ github.run_number }}
          path: |
            reports/latest/live_ui_semantic_proof/
            reports/latest/full_dashboard_acceptance/
          if-no-files-found: warn
          retention-days: 14
