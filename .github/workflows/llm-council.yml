name: LLM Council Independent Review
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  council:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build exact PR diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            git diff "$BASE_SHA" HEAD > /tmp/council.diff
          else
            git diff HEAD^ HEAD > /tmp/council.diff
          fi
          test -s /tmp/council.diff
      - name: Run deterministic unit tests
        run: python -m unittest discover -s council -p 'test_*.py' -v
      - name: Independent three-provider review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python council/council.py --diff /tmp/council.diff --sha "$GITHUB_SHA" --output council-evidence.json
      - name: Publish review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: council-evidence
          path: council-evidence.json
          if-no-files-found: warn
