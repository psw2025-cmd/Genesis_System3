name: Options Verifier Diagnostic

on:
  pull_request:
    paths:
      - "src/options_research/manifest.py"
      - "tests/test_options_bigdata_download.py"
      - ".github/workflows/options-verifier-diagnostic.yml"

permissions:
  contents: read

jobs:
  one-day-verifier-counters:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIVE_TRADING_ENABLED: "0"
      SYSTEM3_LIVE_TRADING_ALLOWED: "0"
      DATA_ROOT: storage/verifier_diagnostic
      REPORT_ROOT: reports/latest/options_verifier_diagnostic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pandas requests pyarrow pytest
      - name: Focused verifier tests
        run: python -m pytest -q tests/test_options_bigdata_download.py
      - name: Download real session
        run: >-
          python scripts/options_bigdata_download.py download-nse
          --start 2026-07-24 --end 2026-07-24 --limit 1
          --data-root "$DATA_ROOT" --report-dir "$REPORT_ROOT"
      - name: Run verifier without hiding counters
        continue-on-error: true
        run: >-
          python scripts/options_bigdata_download.py verify
          --start 2026-07-24 --end 2026-07-24 --limit 0
          --data-root "$DATA_ROOT" --report-dir "$REPORT_ROOT"
      - name: Print exact summary
        if: always()
        run: cat "$REPORT_ROOT/summary.json" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: options-verifier-diagnostic-${{ github.run_id }}
          path: |
            reports/latest/options_verifier_diagnostic/
            storage/verifier_diagnostic/manifest.sqlite3
          if-no-files-found: error
