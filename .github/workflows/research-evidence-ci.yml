name: Research Evidence Contracts

on:
  pull_request:
    paths:
      - "dashboard/backend/catalyst_evidence.py"
      - "scripts/research_gate_report.py"
      - "config/lane_research_targets.json"
      - "config/research_experiment_registry.json"
      - "tests/test_catalyst_evidence.py"
      - "tests/test_research_gate_report.py"
      - ".github/workflows/research-evidence-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evidence-contracts:
    name: BLOCKING - point-in-time evidence and research gaps
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SYSTEM3_MODE: analyze
      LIVE_TRADING_ENABLED: "0"
      AUTO_EXECUTE_TRADES: "0"
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest==8.0.2
      - name: Run focused evidence tests
        run: |
          python -m pytest             tests/test_catalyst_evidence.py             tests/test_research_gate_report.py             -o addopts="" -v --tb=short
      - name: Compile changed research modules
        run: |
          python -m py_compile             dashboard/backend/catalyst_evidence.py             scripts/research_gate_report.py
