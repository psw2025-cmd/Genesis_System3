name: Live Proof Center (GCP + Dashboard MRI)

# Continuously refreshes reports/latest/live_proof_center/LATEST on GitHub so every
# agent (ChatGPT/Claude/Cursor/Codex) can read sanitized live forensic proof
# without laptop gcloud / Dhan / IDE access.
#
# Safety: read-only public APIs + gcloud inventory metadata. No secret values,
# no LIVE enablement, no order/mutation calls. Does not trigger Cloud Run Auto Deploy
# (reports/** is outside deploy path filters).

on:
  schedule:
    # Every 2 hours UTC (covers IST market + evening signals windows)
    - cron: "20 */2 * * *"
  workflow_dispatch:
    inputs:
      post_issue_comment:
        description: "Post summary comment on Issue #188"
        type: boolean
        default: true

concurrency:
  group: live-proof-center
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  issues: write
  actions: read

env:
  GOOGLE_CLOUD_PROJECT: system3-openalgo-safe
  GCP_REGION: asia-south1
  GCP_CLOUD_RUN_SERVICE: genesis-system3-web
  SYSTEM3_PUBLIC_BASE_URL: https://genesis-system3-web-doq2wplepa-el.a.run.app
  GCP_WIF_PROVIDER: projects/802404398783/locations/global/workloadIdentityPools/github-genesis-system3/providers/github
  GCP_PROOF_SERVICE_ACCOUNT: genesis-system3-automation@system3-openalgo-safe.iam.gserviceaccount.com
  LIVE_TRADING_ENABLED: "0"
  SYSTEM3_LIVE_TRADING_ALLOWED: "0"
  AUTO_EXECUTE_TRADES: "0"
  CLOUDSDK_CORE_DISABLE_PROMPTS: "1"

jobs:
  proof-center:
    name: Collect + publish live proof center
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Authenticate to Google Cloud (keyless WIF)
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GOOGLE_CLOUD_PROJECT }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_PROOF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check "openpyxl>=3.1.0"
          python -m py_compile scripts/system3_live_proof_center.py

      - name: Fetch origin/main for cross-verify tip
        run: git fetch origin main --depth=1

      - name: Run Live Proof Center collector
        id: collect
        run: |
          set +e
          python scripts/system3_live_proof_center.py
          rc=$?
          echo "PROOF_RC=${rc}" >> "$GITHUB_ENV"
          test -f reports/latest/live_proof_center/LATEST/MANIFEST.json
          exit $?

      - name: Upload proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-proof-center-${{ github.run_id }}
          path: |
            reports/latest/live_proof_center/LATEST/
            reports/coordination/System3_LIVE_PROOF_CENTER.xlsx
            reports/coordination/LIVE_PROOF_CENTER_POINTER.md
          if-no-files-found: warn
          retention-days: 30

      - name: Publish to live-proof-center branch + main
        if: env.PROOF_RC == '0'
        run: |
          git config user.name "system3-live-proof-center[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            reports/latest/live_proof_center/ \
            reports/coordination/System3_LIVE_PROOF_CENTER.xlsx \
            reports/coordination/LIVE_PROOF_CENTER_POINTER.md
          if git diff --cached --quiet; then
            echo "No proof-center changes to publish"
            exit 0
          fi
          git commit -m "chore(proof): refresh live proof center [skip ci]"
          # Durable always-on branch (agents can pin this if main is protected)
          git push -f origin HEAD:live-proof-center
          # Best-effort update of main (may fail under branch protection — branch still has truth)
          set +e
          git pull --rebase origin main
          git push origin HEAD:main
          push_rc=$?
          set -e
          if [ "$push_rc" -ne 0 ]; then
            echo "::warning::Could not push proof pack to main (branch protection?). live-proof-center branch updated."
          fi

      - name: Comment Issue #188
        if: always() && (github.event_name == 'schedule' || github.event.inputs.post_issue_comment != 'false')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MAN=reports/latest/live_proof_center/LATEST/MANIFEST.json
          if [ ! -f "$MAN" ]; then
            echo "No manifest; skip comment"
            exit 0
          fi
          python - <<'PY' > /tmp/proof_comment.md
          import json, os
          from pathlib import Path
          man = json.loads(Path("reports/latest/live_proof_center/LATEST/MANIFEST.json").read_text(encoding="utf-8"))
          xv = man.get("cross_verify") or {}
          repo = os.environ.get("GITHUB_REPOSITORY", "psw2025-cmd/Genesis_System3")
          run_id = os.environ.get("GITHUB_RUN_ID", "")
          print("## SYSTEM3_COORDINATION_V1 — Live Proof Center refresh")
          print()
          print(f"**Generated UTC:** `{man.get('generated_utc')}`")
          print(f"**Run:** https://github.com/{repo}/actions/runs/{run_id}")
          print()
          print("| Field | Value |")
          print("|---|---|")
          print(f"| main | `{xv.get('github_origin_main')}` |")
          print(f"| serving | `{xv.get('serving_sha')}` |")
          print(f"| match | `{xv.get('sha_match')}` |")
          print(f"| APIs OK | {man.get('api_ok')}/{man.get('api_total')} |")
          print(f"| Tabs HTTP OK | {man.get('tabs_http_ok')}/{man.get('tabs_total')} (mount only) |")
          print(f"| GCP inventory | `{man.get('gcp_available')}` |")
          print()
          print("**Agent pack (no laptop access needed):**")
          print(f"- https://github.com/{repo}/tree/live-proof-center/reports/latest/live_proof_center/LATEST")
          print(f"- Excel: `reports/latest/live_proof_center/LATEST/System3_LIVE_PROOF_CENTER.xlsx`")
          print(f"- Pointer: `reports/coordination/LIVE_PROOF_CENTER_POINTER.md`")
          print()
          print("Safety: sanitized; no secret values; LIVE OFF; no orders.")
          PY
          gh issue comment 188 --repo "$GITHUB_REPOSITORY" --body-file /tmp/proof_comment.md
