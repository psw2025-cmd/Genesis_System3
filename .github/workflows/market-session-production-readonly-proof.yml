name: MARKET SESSION - Read-only Cloud Run and PAPER readiness proof
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/market-session-production-readonly-proof.yml
permissions:
  contents: read
  id-token: write
jobs:
  cloud-proof:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'audit/market-session-production-readonly-20261109'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PROJECT: system3-openalgo-safe
      REGION: asia-south1
      SERVICE: genesis-system3-web
      CLOUDSDK_CORE_DISABLE_PROMPTS: '1'
      PAPER_MODE: '1'
      LIVE_TRADING_ENABLED: '0'
      SYSTEM3_LIVE_TRADING_ALLOWED: '0'
      AUTO_EXECUTE_TRADES: '0'
      LIVE_ORDER_AUTHORITY: '0'
      REAL_BROKER_ORDERS: '0'
    steps:
      - name: Authenticate with preverified encrypted JSON credential
        uses: google-github-actions/auth@v2
        with:
          project_id: system3-openalgo-safe
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
      - name: Install Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      - name: Describe production serving revision and safety
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$REGION" --format=json > "$RUNNER_TEMP/service.json"
          python3 - "$RUNNER_TEMP/service.json" "$RUNNER_TEMP/service-url" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          status=d.get("status") or {}
          url=str(status.get("url") or "")
          print("PRODUCTION_URL="+url)
          print("LATEST_READY_REVISION="+str(status.get("latestReadyRevisionName") or "UNKNOWN"))
          for t in status.get("traffic") or []:
              print("PRODUCTION_TRAFFIC="+str(t.get("revisionName") or "LATEST")+"="+str(t.get("percent") or 0)+"pct")
          spec=d.get("spec") or {}
          template=spec.get("template") or d.get("template") or {}
          containers=(template.get("spec") or {}).get("containers") or template.get("containers") or []
          env={e.get("name"):e.get("value") for c in containers for e in c.get("env",[]) if e.get("value") is not None}
          for key,expected in (("PAPER_MODE","1"),("LIVE_TRADING_ENABLED","0"),("SYSTEM3_LIVE_TRADING_ALLOWED","0"),("AUTO_EXECUTE_TRADES","0"),("LIVE_ORDER_AUTHORITY","0"),("REAL_BROKER_ORDERS","0")):
              print("SAFETY_"+key+"="+("PASS" if env.get(key)==expected else "NOT_VERIFIED_OR_MISMATCH"))
          assert url.startswith("https://"),"Service URL missing"
          open(sys.argv[2],"w").write(url)
          PY
      - name: Probe production endpoints with GCP identity (no request bodies)
        shell: bash
        run: |
          set -euo pipefail
          base="$(cat "$RUNNER_TEMP/service-url")"
          token="$(gcloud auth print-identity-token --audiences="$base" 2>/dev/null || true)"
          if [ -n "$token" ]; then echo "CLOUD_RUN_ID_TOKEN=AVAILABLE"; else echo "CLOUD_RUN_ID_TOKEN=UNAVAILABLE"; fi
          for route in /api/market-status /api/deploy/info /api/health /api/options/gainers /api/market/top-gainers /ui; do
            if [ -n "$token" ]; then
              status="$(curl --silent --show-error --max-time 6 --output /dev/null --write-out '%{http_code}' -H "Authorization: Bearer $token" "$base$route" || true)"
            else
              status="$(curl --silent --show-error --max-time 6 --output /dev/null --write-out '%{http_code}' "$base$route" || true)"
            fi
            echo "ENDPOINT $route HTTP $status"
          done
          unset token
      - name: Inspect revision readiness and sanitized recent Cloud Run errors
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$SERVICE" --project="$PROJECT" --region="$REGION" --format=json > "$RUNNER_TEMP/inspect-service.json"
          python3 - "$RUNNER_TEMP/inspect-service.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          metadata=d.get("metadata") or {}
          status=d.get("status") or {}
          spec=d.get("spec") or {}
          print("CLOUD_RUN_INGRESS="+str((metadata.get("annotations") or {}).get("run.googleapis.com/ingress") or "NOT_REPORTED"))
          print("CLOUD_RUN_READY_CONDITION="+str(next((c.get("status") for c in status.get("conditions") or [] if c.get("type")=="Ready"),"NOT_REPORTED")))
          print("CLOUD_RUN_LATEST_READY="+str(status.get("latestReadyRevisionName") or "UNKNOWN"))
          print("CLOUD_RUN_TIMEOUT_SECONDS="+str(((spec.get("template") or {}).get("spec") or {}).get("timeoutSeconds") or "NOT_REPORTED"))
          PY
          if gcloud logging read "resource.type=cloud_run_revision AND resource.labels.service_name=$SERVICE AND severity>=ERROR" \
            --project="$PROJECT" --freshness=2h --limit=20 --format=json > "$RUNNER_TEMP/recent-errors.json" 2>/dev/null; then
            python3 - "$RUNNER_TEMP/recent-errors.json" <<'PY'
          import json,sys
          rows=json.load(open(sys.argv[1]))
          print("CLOUD_RUN_RECENT_ERROR_EVENTS="+str(len(rows)))
          for row in rows[:12]:
              status=str((row.get("httpRequest") or {}).get("status") or "")
              severity=str(row.get("severity") or "")
              revision=str((row.get("resource") or {}).get("labels",{}).get("revision_name") or "")
              # Do NOT print log bodies, request URLs, user data, auth headers.
              print("ERROR_EVENT timestamp="+str(row.get("timestamp") or "")+
                    " revision="+revision+" severity="+severity+" http_status="+status)
          PY
          else
            echo "CLOUD_RUN_LOG_ERRORS=NOT_VERIFIED"
          fi
          echo "READ_ONLY_HEALTH_CHECK_COMPLETE"
      - name: Inspect cloud scheduler and run jobs read-only
        shell: bash
        run: |
          set -euo pipefail
          if gcloud scheduler jobs list --project="$PROJECT" --location="$REGION" --format=json > "$RUNNER_TEMP/scheduler.json" 2>/dev/null; then
            python3 - "$RUNNER_TEMP/scheduler.json" <<'PY'
          import json,sys
          jobs=json.load(open(sys.argv[1]))
          print("SCHEDULER_LIST=PASS count="+str(len(jobs)))
          for j in jobs:
              name=str(j.get("name") or "").rsplit("/",1)[-1]
              if "genesis" in name.lower() or "system3" in name.lower():
                  print("GENESIS_SCHEDULE="+name+" state="+str(j.get("state") or "UNKNOWN"))
          PY
          else
            echo "SCHEDULER_LIST=NOT_VERIFIED"
          fi
          if gcloud run jobs list --project="$PROJECT" --region="$REGION" --format=json > "$RUNNER_TEMP/jobs.json" 2>/dev/null; then
            python3 - "$RUNNER_TEMP/jobs.json" <<'PY'
          import json,sys
          jobs=json.load(open(sys.argv[1]))
          print("CLOUD_RUN_JOB_LIST=PASS count="+str(len(jobs)))
          for j in jobs:
              name=str((j.get("metadata") or {}).get("name") or j.get("name") or "").rsplit("/",1)[-1]
              if "genesis" in name.lower() or "paper" in name.lower() or "gain" in name.lower():
                  print("GENESIS_RUN_JOB="+name)
          PY
          else
            echo "CLOUD_RUN_JOB_LIST=NOT_VERIFIED"
          fi
          echo "READ_ONLY_NO_BROKER_ORDERS=TRUE"
