name: Security Audit Evidence

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

env:
  LIVE_TRADING_ENABLED: "0"
  SYSTEM3_LIVE_TRADING_ALLOWED: "0"
  AUTO_EXECUTE_TRADES: "0"
  ANALYZE_MODE: "1"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/frontend/package-lock.json

      - name: Install audit tools
        run: python -m pip install --disable-pip-version-check "pip-audit>=2.9" "bandit>=1.8"

      - name: Prepare evidence directory
        run: mkdir -p reports/latest/security_audit/raw

      - name: Audit root Python dependencies
        shell: bash
        run: |
          set +e
          pip-audit -r requirements.txt -f json -o reports/latest/security_audit/raw/pip-root.json
          echo "pip_root_rc=$?" >> reports/latest/security_audit/raw/scan-exit-codes.txt
          exit 0

      - name: Audit dashboard backend Python dependencies
        shell: bash
        run: |
          set +e
          pip-audit -r dashboard/backend/requirements.txt -f json -o reports/latest/security_audit/raw/pip-backend.json
          echo "pip_backend_rc=$?" >> reports/latest/security_audit/raw/scan-exit-codes.txt
          exit 0

      - name: Audit frontend dependencies
        working-directory: dashboard/frontend
        shell: bash
        run: |
          set +e
          npm ci --legacy-peer-deps
          npm audit --json > ../../reports/latest/security_audit/raw/npm-audit.json
          echo "npm_audit_rc=$?" >> ../../reports/latest/security_audit/raw/scan-exit-codes.txt
          npm outdated --json > ../../reports/latest/security_audit/raw/npm-outdated.json 2>/dev/null
          echo "npm_outdated_rc=$?" >> ../../reports/latest/security_audit/raw/scan-exit-codes.txt
          exit 0

      - name: Run Bandit static security scan
        shell: bash
        run: |
          set +e
          bandit -r core dashboard/backend scripts src -f json -o reports/latest/security_audit/raw/bandit.json
          echo "bandit_rc=$?" >> reports/latest/security_audit/raw/scan-exit-codes.txt
          exit 0

      - name: Build fail-closed security checklist
        shell: bash
        run: |
          set +e
          python scripts/security_audit_summary.py
          rc=$?
          echo "SECURITY_AUDIT_RC=${rc}" >> "$GITHUB_ENV"
          exit 0

      - name: Upload security audit evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: security-audit-${{ github.run_number }}
          path: reports/latest/security_audit/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce security audit result
        shell: bash
        run: exit "${SECURITY_AUDIT_RC:-2}"
