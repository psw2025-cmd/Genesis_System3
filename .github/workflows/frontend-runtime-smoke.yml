name: Frontend Browser Runtime Smoke

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: frontend-runtime-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  SYSTEM3_MODE: analyze
  ANALYZE_MODE: "1"
  LIVE_TRADING_ENABLED: "0"
  SYSTEM3_LIVE_TRADING_ALLOWED: "0"
  AUTO_EXECUTE_TRADES: "0"
  SYSTEM3_REAL_ONLY: "1"
  SYSTEM3_LOCAL_BASE_URL: "http://127.0.0.1:8000"

jobs:
  frontend-browser-runtime-smoke:
    name: BLOCKING - frontend browser runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: dashboard/frontend
        run: npm ci --no-audit --no-fund

      - name: Build production frontend
        working-directory: dashboard/frontend
        run: npm run build

      - name: Compile local browser and temporal-truth harnesses
        run: |
          python -m py_compile scripts/frontend_local_runtime_smoke.py
          python -m py_compile scripts/system3_temporal_truth_guard.py

      - name: Enforce temporal truth contracts
        run: |
          python -m unittest tests.test_temporal_truth_contract tests.test_live_ui_truth_remediation_contract

      - name: Prove all canonical tabs render in local browser harness
        run: |
          set -euo pipefail
          rc=1
          for attempt in 1 2; do
            set +e
            timeout 180s python scripts/frontend_local_runtime_smoke.py
            rc=$?
            set -e
            if [[ "$rc" -eq 0 ]]; then
              echo "frontend_browser_smoke_attempt_${attempt}=PASS"
              exit 0
            fi
            [[ "$attempt" -eq 1 ]] && sleep 3
          done
          exit "$rc"

      - name: Upload local 22-tab visual proof
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-ui-proof-${{ github.run_number }}
          path: frontend-ui-proof/
          if-no-files-found: warn
          retention-days: 30
