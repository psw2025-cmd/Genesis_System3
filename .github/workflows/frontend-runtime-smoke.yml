name: Frontend Browser Runtime Smoke

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: frontend-runtime-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  SYSTEM3_MODE: analyze
  ANALYZE_MODE: "1"
  LIVE_TRADING_ENABLED: "0"
  SYSTEM3_LIVE_TRADING_ALLOWED: "0"
  AUTO_EXECUTE_TRADES: "0"
  SYSTEM3_REAL_ONLY: "1"

jobs:
  frontend-browser-runtime-smoke:
    name: BLOCKING - frontend browser runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: dashboard/frontend
        shell: bash
        run: npm ci --no-audit --no-fund

      - name: Build production frontend
        working-directory: dashboard/frontend
        shell: bash
        run: npm run build

      - name: Compile browser smoke harness
        shell: bash
        run: python -m py_compile scripts/frontend_local_runtime_smoke.py

      - name: Prove all canonical tabs render in Chrome
        shell: bash
        run: |
          set -euo pipefail
          rc=1
          for attempt in 1 2; do
            set +e
            timeout 180s python scripts/frontend_local_runtime_smoke.py
            rc=$?
            set -e
            if [[ "$rc" -eq 0 ]]; then
              echo "frontend_browser_smoke_attempt_${attempt}=PASS"
              exit 0
            fi
            echo "frontend_browser_smoke_attempt_${attempt}=FAIL rc=${rc}"
            if [[ "$attempt" -eq 1 ]]; then
              sleep 3
            fi
          done
          exit "$rc"

      - name: Upload 22-tab visual proof
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: frontend-ui-proof-${{ github.run_number }}
          path: frontend-ui-proof/
          if-no-files-found: warn
          retention-days: 30
