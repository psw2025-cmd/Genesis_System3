name: Frontend Browser Runtime Smoke

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: frontend-runtime-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  SYSTEM3_MODE: analyze
  ANALYZE_MODE: "1"
  LIVE_TRADING_ENABLED: "0"
  SYSTEM3_LIVE_TRADING_ALLOWED: "0"
  AUTO_EXECUTE_TRADES: "0"
  SYSTEM3_REAL_ONLY: "1"
  SYSTEM3_PUBLIC_BASE_URL: "https://genesis-system3-web-doq2wplepa-el.a.run.app"
  SYSTEM3_LIVE_PROOF_DEPLOY_WAIT_SECONDS: "720"

jobs:
  frontend-browser-runtime-smoke:
    name: BLOCKING - frontend browser runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          clean: true
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: dashboard/frontend
        shell: bash
        run: npm ci --no-audit --no-fund

      - name: Build production frontend
        working-directory: dashboard/frontend
        shell: bash
        run: npm run build

      - name: Compile browser and temporal-truth harnesses
        shell: bash
        run: |
          python -m py_compile scripts/frontend_local_runtime_smoke.py
          python -m py_compile scripts/gcp_live_ui_snapshot.py
          python -m py_compile scripts/gcp_live_ui_semantic_proof.py
          python -m py_compile scripts/system3_temporal_truth_guard.py
          python -m py_compile scripts/system3_resolve_runtime_deploy_sha.py

      - name: Enforce temporal truth and live UI remediation contracts
        shell: bash
        run: |
          python -m unittest \
            tests.test_temporal_truth_contract \
            tests.test_live_ui_truth_remediation_contract

      - name: Prove all canonical tabs render in local Chrome
        shell: bash
        run: |
          set -euo pipefail
          rc=1
          for attempt in 1 2; do
            set +e
            timeout 180s python scripts/frontend_local_runtime_smoke.py
            rc=$?
            set -e
            if [[ "$rc" -eq 0 ]]; then
              echo "frontend_browser_smoke_attempt_${attempt}=PASS"
              exit 0
            fi
            echo "frontend_browser_smoke_attempt_${attempt}=FAIL rc=${rc}"
            if [[ "$attempt" -eq 1 ]]; then
              sleep 3
            fi
          done
          exit "$rc"

      - name: Upload 22-tab local visual proof
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: frontend-ui-proof-${{ github.run_number }}
          path: frontend-ui-proof/
          if-no-files-found: warn
          retention-days: 30

      - name: Resolve expected runtime-affecting serving SHA
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: python scripts/system3_resolve_runtime_deploy_sha.py --write-github-env

      - name: Capture exact-SHA request-scoped read-only live production UI lifecycle proof
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: timeout 900s python scripts/gcp_live_ui_snapshot.py

      - name: Upload live production UI lifecycle proof
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: live-production-ui-proof-${{ github.run_number }}
          path: live-production-ui-proof/
          if-no-files-found: error
          retention-days: 14
