name: Full Cloud Audit and Forensic Consensus

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: full-cloud-audit-${{ github.sha }}
  cancel-in-progress: false

env:
  GOOGLE_CLOUD_PROJECT: system3-openalgo-safe
  GCP_REGION: asia-south1
  GCP_CLOUD_RUN_SERVICE: genesis-system3-web
  DHAN_ROTATION_JOB: genesis-system3-dhan-token-rotate
  DHAN_ROTATION_SCHEDULER: genesis-system3-dhan-token-rotate-daily
  GCP_WIF_PROVIDER: projects/802404398783/locations/global/workloadIdentityPools/github-genesis-system3/providers/github
  GCP_AUDIT_SERVICE_ACCOUNT: genesis-system3-automation@system3-openalgo-safe.iam.gserviceaccount.com
  LIVE_TRADING_ENABLED: "0"
  SYSTEM3_LIVE_TRADING_ALLOWED: "0"
  AUTO_EXECUTE_TRADES: "0"
  ANALYZE_MODE: "1"
  ELASTICSEARCH_URL: ${{ vars.ELASTICSEARCH_URL }}
  JAEGER_ENDPOINT: ${{ vars.JAEGER_ENDPOINT }}
  GRAFANA_URL: ${{ vars.GRAFANA_URL }}
  POWERBI_PUSH_URL: ${{ vars.POWERBI_PUSH_URL }}
  BIGQUERY_AUDIT_DATASET: ${{ vars.BIGQUERY_AUDIT_DATASET }}

jobs:
  audit:
    name: Read-only cloud forensic audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Authenticate to Google Cloud with keyless WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GOOGLE_CLOUD_PROJECT }}
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_AUDIT_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install read-only audit dependencies
        run: python -m pip install --disable-pip-version-check "requests>=2.33.0"

      - name: Compile cloud audit and consensus tools
        run: |
          python -m py_compile scripts/gcp_full_cloud_audit.py
          python -m py_compile scripts/gcp_dhan_rotator_forensic.py
          python -m py_compile scripts/fetch_exact_security_audit.py
          python -m py_compile scripts/evaluate_rotator_reliability.py
          python -m py_compile scripts/multi_ai_audit_consensus.py

      - name: Collect Google Cloud runtime, logging, TLS and latency evidence
        shell: bash
        run: |
          set +e
          python scripts/gcp_full_cloud_audit.py
          rc=$?
          echo "CLOUD_AUDIT_RC=${rc}" >> "$GITHUB_ENV"
          exit 0

      - name: Evaluate Dhan rotator reliability separately from broker health
        shell: bash
        run: |
          set +e
          python scripts/evaluate_rotator_reliability.py
          rc=$?
          echo "ROTATOR_RELIABILITY_RC=${rc}" >> "$GITHUB_ENV"
          exit 0

      - name: Classify latest Dhan rotator execution from logs read-only
        shell: bash
        run: |
          set +e
          python scripts/gcp_dhan_rotator_forensic.py
          rc=$?
          echo "ROTATOR_FORENSIC_RC=${rc}" >> "$GITHUB_ENV"
          exit 0

      - name: Fetch exact-SHA security audit artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          python scripts/fetch_exact_security_audit.py
          rc=$?
          echo "SECURITY_FETCH_RC=${rc}" >> "$GITHUB_ENV"
          exit 0

      - name: Run OpenAI and Claude audit consultation in parallel
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_AUDIT_MODEL: ${{ vars.OPENAI_AUDIT_MODEL || 'gpt-4o' }}
          ANTHROPIC_AUDIT_MODEL: ${{ vars.ANTHROPIC_AUDIT_MODEL || 'claude-sonnet-4-20250514' }}
          ANTHROPIC_1M_BETA_HEADER: ${{ vars.ANTHROPIC_1M_BETA_HEADER }}
        shell: bash
        run: |
          set +e
          python scripts/multi_ai_audit_consensus.py
          rc=$?
          echo "AI_CONSENSUS_RC=${rc}" >> "$GITHUB_ENV"
          exit 0

      - name: Build unified fail-closed audit verdict
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          def load(path):
              try:
                  return json.loads(Path(path).read_text(encoding='utf-8'))
              except Exception as exc:
                  return {'state':'NOT_PROVEN','error':type(exc).__name__}

          cloud=load('reports/latest/full_cloud_audit/full_cloud_audit.json')
          rotator=load('reports/latest/rotator_reliability/rotator_reliability.json')
          security=load('reports/latest/security_audit/security_audit.json')
          exact=load('reports/latest/security_audit/exact_fetch_state.json')
          ai=load('reports/latest/ai_consensus/ai_consensus.json')
          conditions={
              'cloud_audit_pass': cloud.get('state') == 'PASS',
              'cloud_safety_pass': (cloud.get('safety') or {}).get('state') == 'PASS',
              'rotator_reliability_pass': rotator.get('state') == 'PASS',
              'exact_security_evidence': exact.get('state') == 'PASS' and exact.get('sha') == os.environ.get('GITHUB_SHA'),
              'security_audit_pass': security.get('state') == 'PASS',
              'ai_consensus_pass': ai.get('state') == 'PASS',
          }
          overall='PASS' if all(conditions.values()) else 'FAIL'
          report={
              'schema':'genesis-system3-unified-cloud-audit-v2',
              'state':overall,
              'github_sha':os.environ.get('GITHUB_SHA'),
              'conditions':conditions,
              'cloud_state':cloud.get('state'),
              'rotator_reliability_state':rotator.get('state'),
              'security_state':security.get('state'),
              'ai_state':ai.get('state'),
              'external_adapter_states':((cloud.get('durable_trail') or {}).get('external_adapters') or {}),
              'remediation_authority':'SEPARATE_BOUNDED_FAIL_CLOSED_PATH',
              'auto_deploy_or_live_order_authority_granted':False,
              'live_trading_enabled':False,
              'order_actions_performed':False,
              'secret_payloads_exposed':False,
          }
          out=Path('reports/latest/full_cloud_audit')
          out.mkdir(parents=True, exist_ok=True)
          (out/'unified_verdict.json').write_text(json.dumps(report, indent=2, sort_keys=True), encoding='utf-8')
          md=[
              '# Unified Cloud Audit Verdict','',f"Overall: **{overall}**",'',
              f"- Cloud runtime audit: `{cloud.get('state')}`",
              f"- Dhan rotator reliability: `{rotator.get('state')}`",
              f"- Exact security audit: `{security.get('state')}`",
              f"- AI consensus: `{ai.get('state')}`",
              f"- Exact-SHA security artifact: `{conditions['exact_security_evidence']}`",
              '- LIVE trading: **OFF/LOCKED**','- Order actions performed: **false**','',
              'Healthy broker state cannot override rotator reliability failure.',
              'A deterministic FAIL/BLOCKED state cannot be overridden by AI.',''
          ]
          (out/'unified_verdict.md').write_text('\n'.join(md), encoding='utf-8')
          print('UNIFIED_CLOUD_AUDIT', json.dumps(report, sort_keys=True))
          PY

      - name: Upload full forensic proof bundle
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: full-cloud-audit-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            reports/latest/full_cloud_audit/
            reports/latest/rotator_reliability/
            reports/latest/dhan_rotator_forensics/
            reports/latest/security_audit/
            reports/latest/ai_consensus/
          if-no-files-found: error
          retention-days: 90

      - name: Enforce unified audit verdict
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('reports/latest/full_cloud_audit/unified_verdict.json')
          if not p.is_file():
              raise SystemExit('UNIFIED_AUDIT_EVIDENCE_MISSING')
          report=json.loads(p.read_text(encoding='utf-8'))
          if report.get('state') != 'PASS':
              raise SystemExit(f"UNIFIED_AUDIT_FAIL {report.get('conditions')}")
          print('UNIFIED_AUDIT=PASS')
          PY
