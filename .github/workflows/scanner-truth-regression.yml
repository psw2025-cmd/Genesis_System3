name: Scanner Truth Regression (PAPER ONLY)
on:
  pull_request:
    paths:
      - dashboard/backend/contract_gain_scanner.py
      - tests/test_scanner_truth_guards.py
      - tests/test_actionable_gainer_contract.py
      - .github/workflows/scanner-truth-regression.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scanner-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PAPER_MODE: "1"
      ANALYZE_MODE: "1"
      LIVE_TRADING_ENABLED: "0"
      SYSTEM3_LIVE_TRADING_ALLOWED: "0"
      LIVE_ORDER_AUTHORITY: "0"
      AUTO_EXECUTE_TRADES: "0"
      ORDER_PLACEMENT_ALLOWED: "false"
      REAL_BROKER_ORDERS: "0"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated test runner
        run: python -m pip install pytest==8.3.5
      - name: Compile scanner and regression tests
        run: python -m py_compile dashboard/backend/contract_gain_scanner.py tests/test_scanner_truth_guards.py tests/test_actionable_gainer_contract.py
      - name: Prove scanner truth guards
        run: python -m pytest -q -o addopts="" tests/test_scanner_truth_guards.py tests/test_actionable_gainer_contract.py
