name: Temporary Dhan and Secrets Read-Only Health Proof
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/dhan-secrets-readonly-proof.yml
permissions:
  contents: read
jobs:
  dhan-readonly:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'audit/dhan-secrets-readonly-20261109'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
      DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
      PRESENT_GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON != '' }}
      PRESENT_GCP_SA_KEY: ${{ secrets.GCP_SA_KEY != '' }}
      PRESENT_DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN != '' }}
      PRESENT_DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID != '' }}
      PRESENT_DASHBOARD_API_KEY: ${{ secrets.DASHBOARD_API_KEY != '' }}
      PRESENT_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Check encrypted secret names without revealing values
        shell: bash
        run: |
          echo "GCP_SERVICE_ACCOUNT_JSON_PRESENT=$PRESENT_GCP_SERVICE_ACCOUNT_JSON"
          echo "GCP_SA_KEY_PRESENT=$PRESENT_GCP_SA_KEY"
          echo "DHAN_ACCESS_TOKEN_PRESENT=$PRESENT_DHAN_ACCESS_TOKEN"
          echo "DHAN_CLIENT_ID_PRESENT=$PRESENT_DHAN_CLIENT_ID"
          echo "DASHBOARD_API_KEY_PRESENT=$PRESENT_DASHBOARD_API_KEY"
          echo "ANTHROPIC_API_KEY_PRESENT=$PRESENT_ANTHROPIC_API_KEY"
      - name: Test Dhan profile and daily orderbook using GET only
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError,URLError
          from datetime import datetime
          from zoneinfo import ZoneInfo
          token=os.environ.get("DHAN_ACCESS_TOKEN","")
          client=os.environ.get("DHAN_CLIENT_ID","")
          if not token or not client:
              print("DHAN_API_AUTH=BLOCKED_MISSING_SECRETS")
              raise SystemExit(0)
          headers={"access-token":token,"client-id":client,"Accept":"application/json"}
          for label,url in (
              ("PROFILE","https://api.dhan.co/v2/profile"),
              ("ORDERS","https://api.dhan.co/v2/orders")
          ):
              try:
                  req=Request(url,headers=headers,method="GET")
                  with urlopen(req,timeout=20) as response:
                      status=response.status
                      payload=json.loads(response.read(1000000))
                  print("DHAN_"+label+"_HTTP="+str(status))
                  if label=="PROFILE":
                      if not isinstance(payload,dict):
                          print("DHAN_PROFILE_JSON=UNEXPECTED_SCHEMA")
                          continue
                      expiry=str(payload.get("tokenValidity") or "")
                      if expiry:
                          try:
                              dt=datetime.strptime(expiry,"%d/%m/%Y %H:%M").replace(tzinfo=ZoneInfo("Asia/Kolkata"))
                              state="EXPIRED" if dt<datetime.now(ZoneInfo("Asia/Kolkata")) else "VALID_AT_CHECK_TIME"
                          except (TypeError,ValueError):
                              state="UNKNOWN_EXPIRY_FORMAT"
                      else:
                          state="NOT_REPORTED"
                      print("DHAN_TOKEN_VALIDITY="+state)
                      plan=str(payload.get("dataPlan") or "NOT_REPORTED").upper()
                      print("DHAN_DATA_PLAN_STATUS="+("ACTIVE" if plan=="ACTIVE" else ("NOT_ACTIVE_OR_UNREPORTED" if plan in ("", "NOT_REPORTED") else "NOT_ACTIVE")))
                  else:
                      if isinstance(payload,list):
                          print("DHAN_ORDERS_JSON=VALID_LIST")
                          print("DHAN_TODAY_ORDER_COUNT="+str(len(payload)))
                      else:
                          print("DHAN_ORDERS_JSON=UNEXPECTED_SCHEMA")
              except HTTPError as exc:
                  print("DHAN_"+label+"_HTTP="+str(exc.code))
                  print("DHAN_"+label+"_RESULT=API_REJECTED")
              except (URLError, TimeoutError, OSError, json.JSONDecodeError) as exc:
                  print("DHAN_"+label+"_RESULT=TRANSPORT_OR_RESPONSE_ERROR")
                  print("DHAN_"+label+"_ERROR_TYPE="+type(exc).__name__)
          print("READ_ONLY=TRUE")
          print("BROKER_ORDER_METHODS_USED=GET_ONLY")
          PY
