name: Cloud Current Main Convergence

# RHUI_RULE_V2.2 CLOUD-ONLY: GitHub main is code authority and GCP Cloud Run
# is runtime authority. Runtime-affecting main changes must therefore invoke
# the existing guarded reusable deploy workflow so exact-serving proof can
# converge instead of waiting forever on an older revision.
#
# This wrapper intentionally does not add any broker token, order, or LIVE
# mutation path. The called workflow keeps the existing PAPER/ANALYZER safety
# gates and LIVE locks.
on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "core/**"
      - "scripts/gcp_worker_job.py"
      - "scripts/smoke_ml_validate_e2e.py"
      - "scripts/start_cloud_run.py"
      - "scripts/gcp_dhan_token_rotation_job.py"
      - "scripts/gcp_cloud_run_auto_deploy.py"
      - "scripts/gcp_cloud_run_auto_deploy_impl.py"
      - "scripts/gcp_runtime_iam_preflight.py"
      - "scripts/gcp_failed_revision_forensic.py"
      - "scripts/gcp_runtime_evidence.py"
      - "scripts/gcp_public_dashboard_runtime_proof.py"
      - "scripts/gcp_mutation_policy_runtime_proof.py"
      - "scripts/gcp_runtime_identity_safety.py"
      - "scripts/sync_dhan_instruments_master.py"
      - "src/**"
      - "config/**"
      - "deploy/gcp/**"
      - ".github/workflows/cloud-run-auto-deploy.yml"
      - ".github/workflows/gcp-dhan-token-rotation.yml"
      - ".github/workflows/cloud-current-main-convergence.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  statuses: write

concurrency:
  group: cloud-current-main-convergence
  cancel-in-progress: false

jobs:
  converge-current-main:
    name: Guarded Cloud Run current-main convergence
    uses: ./.github/workflows/cloud-run-auto-deploy.yml
    secrets: inherit
