name: Quant AlphaTruth Evaluator

on:
  push:
    branches: [main]
    paths:
      - "src/quant/**"
      - "scripts/quant_alpha_evaluator.py"
      - "config/quant_alpha_targets.json"
      - "reports/latest/recent_backtest_walkforward_proof/**"
      - "tests/test_quant_alpha_truth.py"
      - ".github/workflows/quant-alpha-evaluator.yml"
  pull_request:
    paths:
      - "src/quant/**"
      - "scripts/quant_alpha_evaluator.py"
      - "config/quant_alpha_targets.json"
      - "reports/latest/recent_backtest_walkforward_proof/**"
      - "tests/test_quant_alpha_truth.py"
      - ".github/workflows/quant-alpha-evaluator.yml"
  schedule:
    - cron: "30 14 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LIVE_TRADING_ENABLED: "0"
      SYSTEM3_LIVE_TRADING_ALLOWED: "0"
      AUTO_EXECUTE_TRADES: "0"
      ANALYZE_MODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused test dependency
        run: python -m pip install "pytest>=8,<10"

      - name: Compile AlphaTruth only
        run: python -m compileall -q src/quant scripts/quant_alpha_evaluator.py tests/test_quant_alpha_truth.py

      - name: Run deterministic AlphaTruth tests
        run: python -m pytest -q tests/test_quant_alpha_truth.py

      - name: Classify current legacy costed walk-forward proof
        run: python scripts/quant_alpha_evaluator.py

      - name: Enforce fail-closed evaluator contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("reports/latest/quant_alpha_evaluator/evaluation.json")
          report = json.loads(path.read_text(encoding="utf-8"))
          assert report["live_trading_enabled"] is False
          assert report["real_orders_attempted"] == 0
          assert report["model_auto_promotion_allowed"] is False
          assert report["destructive_git_reset_allowed"] is False
          assert report["retry_budget"] == 5
          assert report["state"] in {
              "PROVEN", "TARGET_FAIL", "INSUFFICIENT_EVIDENCE", "LEAKAGE_BLOCKED", "SCHEMA_ERROR", "DATA_ERROR"
          }
          if report["state"] == "PROVEN":
              assert report["research_candidate_allowed"] is True
              assert not report.get("blockers")
          else:
              assert report["research_candidate_allowed"] is False
          print("ALPHATRUTH_CI_CONTRACT_OK", report["state"])
          PY

      - name: Upload AlphaTruth evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quant-alpha-evaluator-${{ github.run_number }}
          path: reports/latest/quant_alpha_evaluator/evaluation.json
          if-no-files-found: error
          retention-days: 30
