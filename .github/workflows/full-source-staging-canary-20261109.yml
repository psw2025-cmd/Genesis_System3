name: One-time Full-Source Genesis Staging Canary (NO TRAFFIC)
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/full-source-staging-canary-20261109.yml
permissions:
  contents: read
jobs:
  canonical-source-staging-only:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'audit/full-source-staging-canary-20261109'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROJECT: system3-openalgo-safe
      REGION: asia-south1
      STAGING: genesis-system3-web-staging
      PINNED_SHA: 97fa06c80d6b19e422ece9365143b751ed7a5c17
      CANARY_TAG: audit-97fa06c
      CLOUDSDK_CORE_DISABLE_PROMPTS: '1'
    steps:
      - name: Checkout the exact approved main commit, not PR code
        uses: actions/checkout@v4
        with:
          ref: 97fa06c80d6b19e422ece9365143b751ed7a5c17
          persist-credentials: false
      - name: Reject any changed main commit or canonical source violation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PINNED_SHA"
          python scripts/cloud_run_source_integrity_gate.py --root .
          test -f cloudbuild.recovery.yaml
          test -f dashboard/backend/Dockerfile
          echo "CANONICAL_SOURCE_PREFLIGHT=PASS"
      - name: Authenticate as verified JSON deploy identity
        uses: google-github-actions/auth@v2
        with:
          project_id: system3-openalgo-safe
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
      - name: Install gcloud
        uses: google-github-actions/setup-gcloud@v2
      - name: Prove staging service and current 100 percent traffic baseline
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$STAGING" --project="$PROJECT" --region="$REGION" --format=json > "$RUNNER_TEMP/baseline.json"
          python3 - "$RUNNER_TEMP/baseline.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          ts=(d.get("status") or {}).get("traffic") or []
          active=[t for t in ts if int(t.get("percent") or 0)>0]
          if len(active)!=1 or int(active[0].get("percent") or 0)!=100 or not active[0].get("revisionName"):
              raise SystemExit("BLOCKED_STAGING_TRAFFIC_BASELINE_NOT_SINGLE_100_PERCENT")
          print("STAGING_BASELINE_REVISION="+active[0]["revisionName"])
          PY
      - name: Build immutable canonical backend/frontend source as isolated recovery image
        shell: bash
        run: |
          set -euo pipefail
          gcloud builds submit . --project="$PROJECT" --region="$REGION" \
            --config=cloudbuild.recovery.yaml \
            --substitutions="_RECOVERY_TAG=$CANARY_TAG,_RECOVERY_SHA=$PINNED_SHA" \
            --timeout=45m --quiet
          echo "CANONICAL_IMAGE_BUILD=PASS"
      - name: Deploy to STAGING with NO TRAFFIC and all trading locks OFF
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="$REGION-docker.pkg.dev/$PROJECT/cloud-run-source-deploy/genesis-system3-recovery:$CANARY_TAG"
          gcloud run deploy "$STAGING" --project="$PROJECT" --region="$REGION" \
            --image="$IMAGE" --tag="$CANARY_TAG" --no-traffic \
            --update-env-vars="PAPER_MODE=1,ANALYZE_MODE=1,LIVE_TRADING_ENABLED=0,SYSTEM3_LIVE_TRADING_ALLOWED=0,AUTO_EXECUTE_TRADES=0,LIVE_ORDER_AUTHORITY=0,REAL_BROKER_ORDERS=0,ORDER_PLACEMENT_ALLOWED=false,USE_LIVE_EXECUTION_ENGINE=0,CLOUD_PAPER_ENGINE=0,DEPLOY_GIT_SHA=$PINNED_SHA" \
            --quiet
          echo "STAGING_CANARY_DEPLOYED_NO_TRAFFIC"
      - name: Verify staging traffic unchanged and candidate receives 0 percent
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$STAGING" --project="$PROJECT" --region="$REGION" --format=json > "$RUNNER_TEMP/after.json"
          python3 - "$RUNNER_TEMP/baseline.json" "$RUNNER_TEMP/after.json" "$CANARY_TAG" <<'PY'
          import json,sys
          before,after=(json.load(open(f)) for f in sys.argv[1:3])
          tag=sys.argv[3]
          def alloc(obj):
              return {x.get("revisionName"):int(x.get("percent") or 0)
                      for x in (obj.get("status") or {}).get("traffic") or []
                      if int(x.get("percent") or 0)>0}
          if alloc(before)!=alloc(after):
              raise SystemExit("FAIL_TRAFFIC_CHANGE_DETECTED")
          candidates=[x for x in (after.get("status") or {}).get("traffic") or [] if x.get("tag")==tag]
          if len(candidates)!=1 or int(candidates[0].get("percent") or 0)!=0:
              raise SystemExit("FAIL_CANARY_TRAFFIC_NOT_ZERO")
          print("STAGING_ORIGINAL_TRAFFIC_UNCHANGED=PASS")
          print("CANDIDATE_TRAFFIC_PERCENT=0")
          print("CANDIDATE_REVISION="+str(candidates[0].get("revisionName") or "UNKNOWN"))
          open("/tmp/genesis-canary-url.txt","w").write(str(candidates[0].get("url") or ""))
          PY
      - name: Confirm candidate routes and provenance without broker actions
        shell: bash
        run: |
          set -euo pipefail
          URL="$(cat /tmp/genesis-canary-url.txt)"
          if [ -z "$URL" ]; then echo "CANARY_PRIVATE_URL_NOT_DISCOVERED"; exit 1; fi
          TOKEN="$(gcloud auth print-identity-token --audiences="$URL" 2>/dev/null || true)"
          export URL TOKEN PINNED_SHA
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          root=os.environ["URL"].rstrip("/")
          token=os.environ.get("TOKEN") or ""
          outcomes={}
          for path in ("/ui","/api/health","/api/deploy/info","/api/market-status","/api/options/gainers","/api/market/top-gainers"):
              headers={"Accept":"application/json"}
              if token:headers["Authorization"]="Bearer "+token
              req=urllib.request.Request(root+path,headers=headers,method="GET")
              try:
                  with urllib.request.urlopen(req,timeout=35) as response:
                      code=response.status;raw=response.read(200000)
              except urllib.error.HTTPError as err:
                  code=err.code;raw=b""
              except Exception as err:
                  print("CANARY_ROUTE="+path+" NETWORK="+type(err).__name__)
                  outcomes[path]=-1
                  continue
              print("CANARY_ROUTE="+path+" HTTP="+str(code))
              outcomes[path]=code
              if path=="/api/deploy/info" and code==200:
                  try:
                      data=json.loads(raw)
                      sha=data.get("git_sha")
                      print("CANARY_DEPLOY_SHA_MATCH="+str(sha==os.environ["PINNED_SHA"]).upper())
                  except ValueError:
                      print("CANARY_DEPLOY_SHA_MATCH=UNKNOWN")
          core=("/ui","/api/health","/api/deploy/info")
          if any(outcomes.get(x)!=200 for x in core):
              raise SystemExit("CANARY_CORE_HTTP_CONTRACT_FAIL")
          if any(outcomes.get(x) in (404,-1) for x in ("/api/options/gainers","/api/market/top-gainers")):
              raise SystemExit("CANARY_MARKET_API_ROUTE_MISSING")
          print("CANDIDATE_SOURCE_API_WIRING=PASS")
          print("BROKER_ORDERS_PLACED=0")
          PY
      - name: Final receipt
        if: always()
        run: echo 'CANARY_TEST_ONLY;STAGING_NO_TRAFFIC;PRODUCTION_UNCHANGED;NO_REAL_BROKER_ORDERS'
