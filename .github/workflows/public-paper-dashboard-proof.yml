name: Public Paper Dashboard Proof

on:
  workflow_run:
    workflows: ["Cloud Run Auto Deploy"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: public-paper-dashboard-proof
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  statuses: write

jobs:
  prove-public-paper-dashboard:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOOGLE_CLOUD_PROJECT: system3-openalgo-safe
      GCP_REGION: asia-south1
      GCP_CLOUD_RUN_SERVICE: genesis-system3-web
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}

      - name: Authenticate to Google Cloud with keyless WIF
        if: ${{ vars.GCP_WIF_PROVIDER != '' && vars.GCP_DEPLOY_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GOOGLE_CLOUD_PROJECT }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Temporary legacy-key authentication fallback
        if: ${{ vars.GCP_WIF_PROVIDER == '' || vars.GCP_DEPLOY_SERVICE_ACCOUNT == '' }}
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Enforce public read-only PAPER dashboard
        run: |
          gcloud run services update "${GCP_CLOUD_RUN_SERVICE}" \
            --project="${GOOGLE_CLOUD_PROJECT}" \
            --region="${GCP_REGION}" \
            --update-env-vars="REQUIRE_API_KEY=false,ANALYZE_MODE=1,SYSTEM3_MODE=ANALYZER,LIVE_TRADING_ENABLED=0,SYSTEM3_LIVE_TRADING_ALLOWED=0,AUTO_EXECUTE_TRADES=0" \
            --remove-secrets=API_KEY

      - name: Prove serving revision configuration
        run: |
          gcloud run services describe "${GCP_CLOUD_RUN_SERVICE}" \
            --project="${GOOGLE_CLOUD_PROJECT}" \
            --region="${GCP_REGION}" \
            --format=json > /tmp/service.json
          python - <<'PY'
          import json, os
          svc = json.load(open('/tmp/service.json'))
          expected = os.environ['EXPECTED_SHA']
          containers = ((((svc.get('spec') or {}).get('template') or {}).get('spec') or {}).get('containers') or [])
          if not containers:
              raise SystemExit('NO_CLOUD_RUN_CONTAINER')
          env = {}
          secret_names = set()
          for row in containers[0].get('env') or []:
              name = row.get('name')
              if not name:
                  continue
              if 'value' in row:
                  env[name] = str(row.get('value'))
              if (row.get('valueFrom') or {}).get('secretKeyRef'):
                  secret_names.add(name)
          latest = ((svc.get('status') or {}).get('latestReadyRevisionName') or '')
          traffic = (svc.get('status') or {}).get('traffic') or []
          latest_100 = any(
              int(item.get('percent') or 0) == 100 and (
                  item.get('revisionName') == latest or item.get('latestRevision') is True
              )
              for item in traffic
          )
          failures = []
          if env.get('DEPLOY_GIT_SHA') != expected:
              failures.append(f"DEPLOY_GIT_SHA={env.get('DEPLOY_GIT_SHA')!r} expected={expected!r}")
          if env.get('REQUIRE_API_KEY', '').lower() not in {'0','false','no','off'}:
              failures.append(f"REQUIRE_API_KEY={env.get('REQUIRE_API_KEY')!r}")
          if 'API_KEY' in secret_names:
              failures.append('API_KEY_STILL_MOUNTED')
          if env.get('ANALYZE_MODE') != '1':
              failures.append(f"ANALYZE_MODE={env.get('ANALYZE_MODE')!r}")
          if env.get('SYSTEM3_MODE', '').upper() != 'ANALYZER':
              failures.append(f"SYSTEM3_MODE={env.get('SYSTEM3_MODE')!r}")
          for key in ('LIVE_TRADING_ENABLED','SYSTEM3_LIVE_TRADING_ALLOWED','AUTO_EXECUTE_TRADES'):
              if env.get(key, '').lower() not in {'0','false','no','off'}:
                  failures.append(f"{key}={env.get(key)!r}")
          if not latest or not latest_100:
              failures.append(f"TRAFFIC_NOT_100_TO_LATEST latest={latest!r} traffic={traffic!r}")
          proof = {
              'expected_sha': expected,
              'deploy_git_sha': env.get('DEPLOY_GIT_SHA'),
              'latest_ready_revision': latest,
              'traffic_100_to_latest': latest_100,
              'require_api_key': env.get('REQUIRE_API_KEY'),
              'api_key_mounted': 'API_KEY' in secret_names,
              'worker_token_mounted': 'WORKER_PUSH_TOKEN' in secret_names,
              'analyze_mode': env.get('ANALYZE_MODE'),
              'system3_mode': env.get('SYSTEM3_MODE'),
              'live_trading_enabled': env.get('LIVE_TRADING_ENABLED'),
              'system3_live_trading_allowed': env.get('SYSTEM3_LIVE_TRADING_ALLOWED'),
              'auto_execute_trades': env.get('AUTO_EXECUTE_TRADES'),
              'state': 'PASS' if not failures else 'FAIL',
              'failures': failures,
          }
          open('/tmp/public_dashboard_config_proof.json','w').write(json.dumps(proof, indent=2, sort_keys=True))
          print(json.dumps(proof, sort_keys=True))
          if failures:
              raise SystemExit('PUBLIC_DASHBOARD_CONFIG_PROOF_FAILED')
          PY

      - name: Prove dashboard opens without API key
        run: |
          SERVICE_URL=$(gcloud run services describe "${GCP_CLOUD_RUN_SERVICE}" \
            --project="${GOOGLE_CLOUD_PROJECT}" \
            --region="${GCP_REGION}" \
            --format='value(status.url)')
          echo "SERVICE_URL=${SERVICE_URL}" >> "$GITHUB_ENV"

          ROOT_STATUS=$(curl -sS -o /tmp/dashboard.html -w '%{http_code}' --max-time 30 "${SERVICE_URL}/")
          AUTH_STATUS=$(curl -sS -o /tmp/auth.json -w '%{http_code}' --max-time 30 "${SERVICE_URL}/api/auth/status")
          STATE_STATUS=$(curl -sS -o /tmp/state.json -w '%{http_code}' --max-time 30 "${SERVICE_URL}/api/state")
          HEALTH_STATUS=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 30 "${SERVICE_URL}/api/health")
          SESSION_STATUS=$(curl -sS -o /tmp/session.json -w '%{http_code}' --max-time 30 \
            -X POST "${SERVICE_URL}/api/auth/session" \
            -H 'Content-Type: application/json' \
            -d '{"api_key":"not-used-in-paper-mode"}')

          jq '{required,configured,authenticated,mode}' /tmp/auth.json
          jq -e '.required == false and .mode == "auth_disabled"' /tmp/auth.json >/dev/null
          [ "${ROOT_STATUS}" = "200" ]
          [ "${AUTH_STATUS}" = "200" ]
          [ "${STATE_STATUS}" = "200" ]
          [ "${HEALTH_STATUS}" = "200" ]
          [ "${SESSION_STATUS}" = "503" ]

          python - <<'PY'
          import json, os
          proof = {
              'service_url': os.environ['SERVICE_URL'],
              'root_http_status': 200,
              'auth_status_http_status': 200,
              'state_http_status': 200,
              'health_http_status': 200,
              'session_creation_when_auth_disabled_http_status': 503,
              'api_key_sent_for_dashboard_reads': False,
              'cookie_sent_for_dashboard_reads': False,
              'dashboard_visible_without_login': True,
              'state': 'PASS',
          }
          open('/tmp/public_dashboard_http_proof.json','w').write(json.dumps(proof, indent=2, sort_keys=True))
          print(json.dumps(proof, sort_keys=True))
          PY

      - name: Capture real deployed dashboard screenshot
        run: |
          mkdir -p reports/latest/public_dashboard_proof
          cp /tmp/public_dashboard_config_proof.json reports/latest/public_dashboard_proof/config.json
          cp /tmp/public_dashboard_http_proof.json reports/latest/public_dashboard_proof/http.json
          google-chrome --headless --disable-gpu --no-sandbox \
            --hide-scrollbars --window-size=1600,1000 --virtual-time-budget=12000 \
            --screenshot=reports/latest/public_dashboard_proof/dashboard.png \
            "${SERVICE_URL}"
          test -s reports/latest/public_dashboard_proof/dashboard.png
          sha256sum reports/latest/public_dashboard_proof/dashboard.png \
            > reports/latest/public_dashboard_proof/dashboard.sha256

      - name: Upload visual and JSON proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-paper-dashboard-proof-${{ github.run_number }}
          path: reports/latest/public_dashboard_proof/
          if-no-files-found: error
          retention-days: 14

      - name: Publish exact-SHA public dashboard PASS
        if: ${{ success() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          sha = os.environ['EXPECTED_SHA']
          repo = os.environ['GITHUB_REPOSITORY']
          api = os.environ['GITHUB_API_URL']
          target = f"{os.environ['GITHUB_SERVER_URL']}/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          body = json.dumps({
              'state': 'success',
              'context': 'public-dashboard/runtime-proof',
              'description': 'PAPER dashboard opens without API key; LIVE remains OFF',
              'target_url': target,
          }).encode()
          req = urllib.request.Request(
              f"{api}/repos/{repo}/statuses/{sha}", data=body,
              headers={
                  'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              }, method='POST')
          with urllib.request.urlopen(req, timeout=30) as response:
              if response.status not in (200, 201):
                  raise SystemExit(f'COMMIT_STATUS_PUBLISH_FAILED {response.status}')
          PY

      - name: Publish exact-SHA public dashboard FAIL
        if: ${{ failure() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          sha = os.environ['EXPECTED_SHA']
          repo = os.environ['GITHUB_REPOSITORY']
          api = os.environ['GITHUB_API_URL']
          target = f"{os.environ['GITHUB_SERVER_URL']}/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          body = json.dumps({
              'state': 'failure',
              'context': 'public-dashboard/runtime-proof',
              'description': 'Public PAPER dashboard proof failed; do not claim no-key access',
              'target_url': target,
          }).encode()
          req = urllib.request.Request(
              f"{api}/repos/{repo}/statuses/{sha}", data=body,
              headers={
                  'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              }, method='POST')
          with urllib.request.urlopen(req, timeout=30) as response:
              if response.status not in (200, 201):
                  raise SystemExit(f'COMMIT_STATUS_PUBLISH_FAILED {response.status}')
          PY
