[tool.black]
line-length = 120
target-version = ["py310"]
force-exclude = "core[\\\\/]engine[\\\\/]ultra_models_loader\\.py"
extend-exclude = '''
(
  \.git
  | \.venv
  | \.pytest_cache
  | node_modules
  | tests/auto/system3_generated_tests
  | desktop_app/dist
  | dashboard/frontend/dist
)
'''

[tool.mypy]
# Legacy codebase, never previously type-checked. Ignore missing
# third-party stubs (fastapi/pydantic/numpy/pandas/etc.) rather than
# installing every dependency into mypy's isolated pre-commit env -
# that surfaces import-resolution noise, not real type errors. Real
# type errors are still reported.
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = "."
exclude = '''(?x)(
    ^venv/
    | ^\.venv/
    | ^node_modules/
    | ^tests/auto/system3_generated_tests/
    | ^dashboard/frontend/
    | ^desktop_app/
)'''

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["core", "tools", "phases", "dashboard", "tests"]
addopts = "-q --disable-warnings --ignore=core/engine/test_angelone_api.py --ignore=core/engine/test_angelone_option_chain.py --ignore=scripts"
norecursedirs = [".git", ".venv", "__pycache__", "node_modules", "tests/auto/system3_generated_tests", "tests/_pending"]





[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E722", "S110", "S112", "E402", "BLE001", "E701", "E702", "S101", "S311", "F401", "E741", "F811", "S301", "S603", "S310", "S607"]
