# Canonical Dhan token rotate job contract (asia-south1)
# Mint authority: Cloud Run Job genesis-system3-dhan-token-rotate ONLY
# Do not mint from web process, deploy, watchdog, or local scripts.
apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: genesis-system3-dhan-token-rotate
  namespace: system3-openalgo-safe
  labels:
    system3.authority: dhan-token-mint
    system3.canonical_secret: dhan-access-token
  annotations:
    system3.pubsub_topic: broker-token-rotate
    system3.mutex: single-execution-plus-expected-version
    system3.cooldown_s: "900"
spec:
  template:
    spec:
      template:
        spec:
          serviceAccountName: genesis-system3-dhan-rotator@system3-openalgo-safe.iam.gserviceaccount.com
          containers:
            - image: PLACEHOLDER_SET_BY_DEPLOY
              env:
                - name: DHAN_ACCESS_TOKEN_SECRET_ID
                  value: dhan-access-token
                - name: DHAN_ROTATION_COOLDOWN_HINT_S
                  value: "900"
          # Runtime: scripts/gcp_dhan_token_rotation_job.py
# Trigger paths (ordered):
# 1) Cloud Scheduler genesis-system3-dhan-token-rotate-daily (07:30 Asia/Kolkata)
# 2) Manual recovery workflow (.github/workflows/gcp-dhan-token-rotation.yml)
# 3) Web auto-heal on DH-906 when DHAN_CANONICAL_ROTATION_SELF_HEAL=1 (invokes :run)
# Pub/Sub topic broker-token-rotate is the named event bus for operators/monitors;
# consumers must invoke the Job above — never mint inline.
