# agent_policy.yaml — permanent invariants for Genesis System3 autonomous SWE loop
# Source authority:
#   - docs/gemini-code-1786899974029.md (user: permanently follow)
#   - docs/END_TO_END_ISSUES_SOLUTIONS_AGENT_POLICY.md + flowchart image (user: all agents permanently follow)

version: 2
target_url: https://genesis-system3-web-doq2wplepa-el.a.run.app/ui
coordination_bus: https://github.com/psw2025-cmd/Genesis_System3/issues/188

invariants:
  zero_synthetic_inventions:
    description: Never fabricate fake prices, synthetic market quotes, or dummy metrics to force green UI.
    allowed_fallbacks: authenticated snapshot buffers only
  strict_risk_and_gate_preservation:
    description: Never weaken, bypass, or lower safety gates, risk limits, or LIVE/order locks.
    live_trading_enabled: false
    order_placement_allowed: false
  test_first_eval_specs:
    description: For every self-discovered issue, write a failing test in tests/evals/ first; only ship when it passes.
    path: tests/evals/

end_to_end_issues_solutions:
  authority_image: docs/agent_memory/END_TO_END_ISSUES_SOLUTIONS_FLOWCHART.png
  authority_doc: docs/END_TO_END_ISSUES_SOLUTIONS_AGENT_POLICY.md
  applies_to_agents: [Cursor, Claude, Codex, Gemini, ChatGPT]
  flow: [issue_found, end_to_end_solution, intermediate_outcome, overall_outcome]
  rows:
    - id: 1
      issue: incomplete_incorrect_intake
      solution: standardize_intake_and_validation
    - id: 2
      issue: unclear_ownership_communication_gaps
      solution: define_roles_and_communication_plan
    - id: 3
      issue: compliance_risks
      solution: standardize_and_ensure_compliance
    - id: 4
      issue: inefficient_review_approval
      solution: streamline_review_and_approval
    - id: 5
      issue: version_control_confusion
      solution: centralized_document_and_version_control
    - id: 6
      issue: manual_repetitive_tasks
      solution: automate_and_digitize
    - id: 7
      issue: lack_of_visibility_tracking
      solution: realtime_tracking_and_dashboards
    - id: 8
      issue: poor_storage_retrieval
      solution: centralized_secure_repository
    - id: 9
      issue: delays_in_authority_signatures
      solution: stakeholder_enablement_and_human_gates
    - id: 10
      issue: poor_post_execution_management
      solution: post_ship_verify_backlog_and_obligations
  overall_outcomes:
    - faster_cycle_time
    - reduced_risk
    - lower_costs
    - better_compliance
    - improved_stakeholder_satisfaction
  key_enablers: [people, process, technology, policies, kpis]

preflight_control_plane:
  authority: SYSTEM3_PREFLIGHT_CONTROL_PLANE_V1
  doc: docs/PREFLIGHT_CONTROL_PLANE.md
  script: scripts/system3_preflight_control_plane.py
  workflow: .github/workflows/system3-preflight-control-plane.yml
  artifacts:
    - reports/latest/control_plane/workflow_issue_artifact_snapshot.json
    - reports/latest/control_plane/NEXT_ACTION.md
  mandatory_before:
    - production_relevant_transition
    - merge_decision
    - deploy_acceptance
    - url_acceptance
    - remediation_handoff
  inventory:
    - current_remote_main
    - all_workflow_latest_runs
    - active_and_current_relevant_failed_runs
    - workflow_artifacts
    - failing_jobs_and_steps
    - active_pull_requests
    - recent_open_issues
    - issue_188_coordination_markers
  transition_law:
    ci_green: merge_without_unnecessary_wait
    merged: check_canonical_deploy
    deploy_complete: verify_exact_serving_sha_then_new_url_proof
    url_fail: investigate_and_open_next_remediation_immediately
    stop_only_for: real_external_dependency_or_genuine_user_approval

continuous_closure:
  doc: docs/CONTINUOUS_CLOSURE_SYSTEM.md
  orchestrator: scripts/system3_continuous_closure_orchestrator.py
  api: /api/continuous_closure
  ui: Overview ContinuousClosureBoard
  artifacts:
    - reports/latest/continuous_closure/summary.json
    - reports/latest/continuous_closure/resume_state.json
  phases:
    - repo_first_scan
    - multi_source_verify
    - watchdog
    - blocker_cards
    - auto_resume
  auto_resume_rule: Next session/Automation reads resume_state.json and executes next OPEN card test-first

loop:
  name: AUTONOMOUS-LOOP-GEMINI
  roles: [Architect, CoreEngineer, QAEvaluator]
  steps:
    - preflight_control_plane
    - crawl_and_backlog
    - deploy_progress_telemetry_banner
    - test_first_heal_and_gitops_release
    - live_verify_sha
    - continuous_closure_orchestrator
    - remove_banner_only_when_all_gates_ready

ban_list:
  - invent_spot_prices
  - force_proof_gate_pass
  - enable_live_trading
  - paste_secrets_or_mint_tokens_outside_job
  - paint_ui_green_without_matching_solution_row
  - skip_post_execution_live_verify
  - skip_fresh_preflight_before_transition
