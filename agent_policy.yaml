# agent_policy.yaml — Genesis System3 local-laptop invariants
version: 6
schema_version: 6
schema_path: schemas/agent_policy.v6.schema.json
target_url: http://127.0.0.1:8000/ui/
coordination_bus: none

execution_authority:
  effective_date: 2026-09-16
  authority_doc: docs/control_plane/LOCAL_LAPTOP_USER_DIRECTIVE_20260907.md
  sole_controller: none
  multi_agent: true
  other_agents_default_role: concurrent_safe_non_overlapping
  other_agents_may_mutate: true
  mutation_requires:
    - dedicated_branch_or_worktree
    - no_overwrite_of_unrelated_dirty_work
    - no_live_trading
    - no_secret_exposure
  claude_only_ownership: false
  mandatory_issue_188: false

mandatory_reads:
  - docs/control_plane/LOCAL_LAPTOP_USER_DIRECTIVE_20260907.md
  - AGENTS.md
  - agent_policy.yaml

runtime:
  authority: local_windows_laptop
  canonical_repository: C:\Genesis_System3_Clean
  upstream: psw2025-cmd/Genesis_System3
  gcp_runtime_authority: false
  cloudrun_acceptance_authority: false
  discover_bound_port: true
  default_ui: http://127.0.0.1:8000/ui/

safety:
  analyze_mode: true
  live_trading_enabled: false
  system3_live_trading_allowed: false
  auto_execute_trades: false
  mode: PAPER_ANALYZER_ONLY
  real_order_count_required: 0
  real_order_placement_modification_cancellation_squareoff: forbidden
  broker_secret_payload_exposure: forbidden
  service_account_json_keys: forbidden
  live_enablement_requires_human_break_glass: true

coordination:
  github_issue_188_is_live_bus: false
  github_issue_188_status: HISTORICAL_ONLY
  parallel_overlapping_mutation: forbidden
  advisory_agents_may_report_findings: true

completion:
  stop_at_code_or_pr_or_ci: false
  require_runtime_proof: true
  require_repo_runtime_authority_reconciled: true
  require_paper_zero_order_proof: true
  require_truthful_ui_proof: true
  genuine_external_or_user_only_blocker_must_be_explicit: true
  statuses_allowed:
    - PASS
    - FAIL
    - BLOCKED
    - UNKNOWN
    - PARTIAL
    - NOT_PROVEN
    - NOT_APPLICABLE
    - HISTORICAL_ONLY

gcp_exit_billing_control:
  runtime_authority: retired
  high_frequency_scheduler_resume_without_reconciled_ssot: forbidden
  do_not_execute_gcloud: true
  do_not_deploy_cloud_run: true

evidence:
  current_evidence_over_historical_claims: true
  chat_memory_is_not_runtime_proof: true
  exact_source_sha_required: true
  local_semantic_proof_required: true
  ui_and_api_parity_required: true
  broker_source_freshness_truth_required: true
