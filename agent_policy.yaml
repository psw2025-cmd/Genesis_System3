  require_broker_lifecycle_proof: true
  require_four_index_chain_semantic_proof: true
  require_scheduler_worker_proof: true
  require_local_db_state_consistency: true
  require_truthful_22_tab_ui_proof: true
  require_ui_and_api_parity: true

